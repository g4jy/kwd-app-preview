n":"the doctor in charge","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"의사의 진찰을 받다.","en":"to be examined by a doctor","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"To call a doctor directly, say 의사 선생님 or just 선생님. Calling out “의사!” sounds rude.","contract_en":""},{"id":"n00570","kind":"word","ko":"병원","yo":"","en":"Hospital","pos":"명사","usage":"","contract":"","examples":[{"id":"e01089","ko":"아이가 아파서 병원에 가요.","en":"My child is sick, so I'm going to the hospital.","speech_level":"해요","cloze":"병원","extra_word":"아이 = child","extra_grammar":"","tip":"","tip_en":""},{"id":"e01090","ko":"주말에는 병원이 쉬어요.","en":"The hospital is closed on weekends.","speech_level":"해요","cloze":"병원","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08960","ko":"언니는 병원에서 일해요.","en":"My older sister works at a hospital.","speech_level":"해요","cloze":"병원","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08961","ko":"병원 앞에 약국이 있어요.","en":"There is a pharmacy in front of the hospital.","speech_level":"해요","cloze":"병원","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08962","ko":"머리가 아파요. 오늘 병원에 가요.","en":"My head hurts. I'm going to the hospital today.","speech_level":"해요","cloze":"병원","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"병ː원","roman":"byeongwon","explain":"작은 동네 병원은 “의원”이라고도 해요. 병원 이름에는 진료과가 많이 나와요: 내과(internal medicine), 치과(dentist), 피부과(dermatology).","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"병원에 입원하다.","en":"to be admitted to a hospital","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"교통사고를 당한 환자를 급히 병원으로 옮겼다.","en":"The patient in the traffic accident was rushed to the hospital.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Small neighborhood clinics are also called 의원. Hospital names often show the department: 내과 (internal medicine), 치과 (dentist), 피부과 (dermatology).","contract_en":""},{"id":"n00574","kind":"word","ko":"회의","yo":"","en":"Meeting / Conference","pos":"명사","usage":"","contract":"","examples":[{"id":"e01147","ko":"오늘 오후에 회의가 있어요.","en":"There's a meeting this afternoon.","speech_level":"해요","cloze":"회의","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01148","ko":"오늘 회의가 길어요. 저는 피곤해요.","en":"Today's meeting is long. I'm tired.","speech_level":"해요","cloze":"회의","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09653","ko":"우리는 사무실에서 회의를 해요.","en":"We have our meetings in the office.","speech_level":"해요","cloze":"회의","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09654","ko":"오늘은 회의가 없어요.","en":"There's no meeting today.","speech_level":"해요","cloze":"회의","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09655","ko":"회의가 몇 시에 있어요? — 세 시에 있어요.","en":"What time is the meeting? — At three.","speech_level":"해요","cloze":"회의","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"회ː의","roman":"hoeui","explain":"회의는 보통 회사에서 여러 사람이 하는 공식적인 모임이에요. 일 때문에 한 사람을 만날 때는 “미팅”이라는 말도 많이 써요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"회의를 소집하다.","en":"To convene a meeting.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"큰누나의 결혼 문제로 가족 회의를 열었다.","en":"We held a family meeting about my eldest sister's marriage.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"부서장들은 간부 회의에서 결정된 사안을 부원들에게 통보하였다.","en":"The department heads informed their staff of the matters decided at the executive meeting.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"회의가 끝나자 그들은 일제히 일어섰다.","en":"When the meeting ended, they all stood up at once.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"회의 is a formal gathering of several people, usually at work. For meeting a single person about business, 미팅 is also very common.","contract_en":""},{"id":"n00577","kind":"word","ko":"숙제","yo":"","en":"Homework","pos":"명사","usage":"","contract":"","examples":[{"id":"e00385","ko":"숙제가 너무 많아요.","en":"There's too much homework.","speech_level":"해요","cloze":"숙제","extra_word":"많다 = to be many, a lot","extra_grammar":"","tip":"","tip_en":""},{"id":"e00386","ko":"동생이 숙제를 안 해요.","en":"My younger sibling doesn't do their homework.","speech_level":"해요","cloze":"숙제","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08864","ko":"오늘 숙제가 뭐예요? — 한국어 쓰기예요.","en":"What's today's homework? — Korean writing.","speech_level":"해요","cloze":"숙제","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08865","ko":"친구하고 같이 숙제를 해요.","en":"I do my homework together with a friend.","speech_level":"해요","cloze":"숙제","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08866","ko":"이 숙제는 정말 어려워요. 언니가 도와줘요.","en":"This homework is really hard. My older sister helps me.","speech_level":"해요","cloze":"숙제","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"숙쩨","roman":"sukje","explain":"숙제는 “숙제를 해요”라고 말해요. “숙제를 공부해요”는 어색해요. 숙제는 보통 집에서 하는 공부예요.","video_url":"","video_title":"","phrases":[],"pron_source":"curriculum","pron_why":{"ch":[[1,"c","tense",-1]],"rules":["tense"],"long":[]},"dict_examples":[{"ko":"숙제를 내다.","en":"to assign homework","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"숙제가 많다.","en":"There is a lot of homework.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"선생님께서 숙제를 꼼꼼히 검사하셨다.","en":"The teacher checked the homework carefully.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Say 숙제를 해요. “숙제를 공부해요” sounds odd. 숙제 is study work you usually do at home.","contract_en":""},{"id":"n00578","kind":"word","ko":"수업","yo":"","en":"Class / Lesson","pos":"명사","usage":"","contract":"","examples":[{"id":"e00421","ko":"오늘은 수업이 없어요.","en":"There's no class today.","speech_level":"해요","cloze":"수업","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00422","ko":"저는 매일 교실에서 수업을 들어요.","en":"I take classes in the classroom every day.","speech_level":"해요","cloze":"수업","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09440","ko":"수업 시간에는 한국어만 써요.","en":"We only use Korean during class.","speech_level":"해요","cloze":"수업","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09441","ko":"월요일에는 수업이 많아요.","en":"I have a lot of classes on Mondays.","speech_level":"해요","cloze":"수업","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09442","ko":"수업은 온라인이에요. 집에서 공부해요.","en":"The class is online. I study at home.","speech_level":"해요","cloze":"수업","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"수업","roman":"sueop","explain":"학생은 “수업을 들어요”, 선생님은 “수업을 해요”라고 해요. 같은 수업인데 동사가 달라요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"수업 시간.","en":"Class time.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"수업 계획.","en":"A lesson plan.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"정규 수업.","en":"Regular classes.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"강사에게 수업을 맡기다.","en":"To entrust the class to an instructor.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"수업 분위기가 좋다.","en":"The class atmosphere is good.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Students say 수업을 들어요 (“listen to a class”), teachers say 수업을 해요 (“do a class”). Same class, different verbs.","contract_en":""},{"id":"n00586","kind":"word","ko":"회사","yo":"","en":"Company / Work","pos":"명사","usage":"","contract":"","examples":[{"id":"e01153","ko":"아홉 시까지 회사에 가요.","en":"I go to work by nine.","speech_level":"해요","cloze":"회사","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01154","ko":"회사 근처에서 점심을 먹어요.","en":"I eat lunch near my office.","speech_level":"해요","cloze":"회사","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08804","ko":"우리 회사는 지하철역 앞에 있어요.","en":"Our company is in front of the subway station.","speech_level":"해요","cloze":"회사","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08805","ko":"회사 사람들하고 점심을 먹어요.","en":"I eat lunch with my coworkers.","speech_level":"해요","cloze":"회사","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08806","ko":"회사 일이 너무 많아요.","en":"I have so much work at the office.","speech_level":"해요","cloze":"회사","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"회ː사","roman":"hoesa","explain":"회사는 ‘company’이면서 ‘직장’처럼 써요. “회사 가요”는 ‘I'm going to work’예요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"제조 회사.","en":"a manufacturing company","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"회사에 출근하다.","en":"to go to work at the company","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"회사를 경영하다.","en":"to manage a company","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"회장은 회사의 경영을 큰아들에게 일임했다.","en":"The chairman left management of the company entirely to his eldest son.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"경영난에 빠진 회사를 전 임직원이 협력하여 다시 일으켰다.","en":"All employees cooperated to revive the company that had fallen into financial trouble.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"회사 is both “company” and “where I work”. 회사 가요 means “I'm going to work”.","contract_en":""},{"id":"n00588","kind":"word","ko":"학교","yo":"","en":"School","pos":"명사","usage":"","contract":"","examples":[{"id":"e00183","ko":"학교에 친구가 많아요.","en":"I have a lot of friends at school.","speech_level":"해요","cloze":"학교","extra_word":"많다 = to be many, a lot","extra_grammar":"","tip":"","tip_en":""},{"id":"e00184","ko":"아침에 학교에 가요.","en":"I go to school in the morning.","speech_level":"해요","cloze":"학교","extra_word":"아침 = morning","extra_grammar":"","tip":"","tip_en":""},{"id":"e08801","ko":"학교 앞에서 친구를 만나요.","en":"I meet my friend in front of the school.","speech_level":"해요","cloze":"학교","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08802","ko":"동생은 학교에서 점심을 먹어요.","en":"My younger sibling eats lunch at school.","speech_level":"해요","cloze":"학교","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08803","ko":"일요일에는 학교에 안 가요.","en":"I don't go to school on Sundays.","speech_level":"해요","cloze":"학교","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"학꾜","roman":"hakgyo","explain":"초등학교, 중학교, 고등학교, 대학교 모두 끝에 “학교”가 있어요. 대학생도 “학교 가요”라고 말해요.","video_url":"","video_title":"","phrases":[],"pron_source":"curriculum","pron_why":{"ch":[[1,"c","tense",-1]],"rules":["tense"],"long":[]},"dict_examples":[{"ko":"학교에 다니다.","en":"to attend school","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"학교를 졸업하다.","en":"to graduate from school","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"학교를 세우다.","en":"to found a school","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"아이를 학교에 보내다.","en":"to send a child to school","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Elementary, middle, high school and university all end in 학교. University students also just say 학교 가요 for going to campus.","contract_en":""},{"id":"n00603","kind":"word","ko":"영화","yo":"","en":"Movie / Film","pos":"명사","usage":"","contract":"","examples":[{"id":"e00697","ko":"어제 친구와 영화를 봤어요.","en":"I watched a movie with a friend yesterday.","speech_level":"해요","cloze":"영화","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00698","ko":"이 영화 정말 재미있어요.","en":"This movie is really fun.","speech_level":"해요","cloze":"영화","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08822","ko":"주말에 영화를 봐요. 같이 가요?","en":"I'm watching a movie this weekend. Do you want to come?","speech_level":"해요","cloze":"영화","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08823","ko":"어떤 영화를 좋아해요? — 코미디를 좋아해요.","en":"What kind of movies do you like? — I like comedies.","speech_level":"해요","cloze":"영화","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08824","ko":"영화는 일곱 시에 시작해요.","en":"The movie starts at seven.","speech_level":"해요","cloze":"영화","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"영화","roman":"yeonghwa","explain":"영화는 “보다”와 같이 써요: 영화를 봐요. 영화를 보는 곳은 “영화관”이에요. “극장”도 같은 곳이에요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"영화 관람.","en":"watching a movie","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"영화 구경을 가다.","en":"to go to see a movie","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"영화를 찍다.","en":"to shoot a film","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Movies go with 보다: 영화를 봐요. The place to watch one is 영화관, also called 극장.","contract_en":""},{"id":"n00614","kind":"word","ko":"콘서트","yo":"","en":"Concert","pos":"명사","usage":"","contract":"","examples":[{"id":"e01207","ko":"콘서트 표를 두 장 샀어요.","en":"I bought two concert tickets.","speech_level":"해요","cloze":"콘서트","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01208","ko":"어제 콘서트에서 노래를 많이 불렀어요. 그래서 목이 아파요.","en":"I sang a lot at the concert yesterday, so my throat hurts.","speech_level":"해요","cloze":"콘서트","extra_word":"목 = throat","extra_grammar":"","tip":"","tip_en":""},{"id":"e09944","ko":"이번 주 토요일에 콘서트에 같이 갈까요? — 네, 좋아요.","en":"Shall we go to a concert together this Saturday? — Yes, sounds good.","speech_level":"해요","cloze":"콘서트","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09945","ko":"콘서트는 몇 시에 시작해요? — 일곱 시에 시작해요.","en":"What time does the concert start? — It starts at seven.","speech_level":"해요","cloze":"콘서트","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09946","ko":"어제 콘서트가 정말 좋았어요. 노래도 많이 했어요.","en":"The concert yesterday was really good. They sang a lot of songs too.","speech_level":"해요","cloze":"콘서트","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"콘서트","roman":"konseoteu","explain":"인기 가수의 콘서트 표는 금방 없어져요. 그래서 표를 사는 일을 ‘티켓팅’이라고 하고, 사람들은 시간을 맞춰서 기다려요.","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","pron_why":null,"dict_examples":[],"explain_en":"Tickets for popular singers sell out fast. Buying them is called 티켓팅 (“ticketing”), and people wait for the exact opening time.","contract_en":""},{"id":"n00630","kind":"word","ko":"노래","yo":"","en":"Song","pos":"명사","usage":"","contract":"","examples":[{"id":"e00733","ko":"이 노래 제목이 뭐예요?","en":"What's the title of this song?","speech_level":"해요","cloze":"노래","extra_word":"제목 = title","extra_grammar":"","tip":"","tip_en":""},{"id":"e00734","ko":"차에서 한국 노래를 들어요.","en":"I listen to Korean songs in the car.","speech_level":"해요","cloze":"노래","extra_word":"차 = car","extra_grammar":"","tip":"","tip_en":""},{"id":"e08930","ko":"이 노래 좋아요. 한 번 더 들어요.","en":"I like this song. I'll listen once more.","speech_level":"해요","cloze":"노래","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08931","ko":"라디오에서 노래가 나와요.","en":"A song is playing on the radio.","speech_level":"해요","cloze":"노래","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08932","ko":"제 친구는 노래를 잘해요.","en":"My friend sings well.","speech_level":"해요","cloze":"노래","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e20331","ko":"친구 생일에 다 같이 노래를 불러요.","en":"We all sing a song together on my friend's birthday.","speech_level":"해요","cloze":"노래","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"노래","roman":"norae","explain":"노래는 곡(song)도 되고 노래하는 일(singing)도 돼요. 그래서 “노래를 잘해요”는 ‘잘 불러요’라는 뜻이에요. 한국 대중가요는 “가요”라고 해요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"노래를 부르다.","en":"to sing a song","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"노래를 짓다.","en":"to compose a song","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"노래를 흥얼거리다.","en":"to hum a song","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그는 노래를 좋아하여 가수가 되었다.","en":"He loved singing and became a singer.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"노래 means both a song and the act of singing, so 노래를 잘해요 means 'sings well'. Korean pop songs are called 가요.","contract_en":""},{"id":"n00648","kind":"word","ko":"부탁","yo":"","en":"Request / Favor","pos":"명사","usage":"","contract":"","examples":[{"id":"e01501","ko":"부탁이 하나 있어요.","en":"I have a favor to ask.","speech_level":"해요","cloze":"부탁","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01502","ko":"친구한테 부탁을 받았어요.","en":"A friend asked me for a favor.","speech_level":"해요","cloze":"부탁","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11967","ko":"무슨 부탁이에요? — 이 가방 좀 들어 주세요.","en":"What's the favor? — Please carry this bag for me.","speech_level":"해요","cloze":"부탁","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11968","ko":"동생 부탁이 너무 많아요. 힘들어요.","en":"My younger sibling asks for too many favors. It's tiring.","speech_level":"해요","cloze":"부탁","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11969","ko":"부탁이 있어요. 내일 일찍 와 주세요.","en":"I have a favor to ask. Please come early tomorrow.","speech_level":"해요","cloze":"부탁","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"부ː탁","roman":"butak","explain":"윗사람에게는 ‘부탁해요’ 대신 ‘부탁드려요’라고 높여서 말해요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"부탁 말씀.","en":"A word of request.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"부탁 편지.","en":"A letter of request.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"부탁을 들어주다.","en":"Grant a request.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"나한테 어려운 부탁이 들어왔는데 어떻게 해야 할지 모르겠다.","en":"I got a difficult request and I don't know what to do.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"To someone senior, say 부탁드려요 instead of 부탁해요; it is the humble, more polite form.","contract_en":""},{"id":"n00652","kind":"word","ko":"질문","yo":"","en":"Question","pos":"명사","usage":"","contract":"","examples":[{"id":"e01477","ko":"선생님, 질문이 있어요.","en":"Teacher, I have a question.","speech_level":"해요","cloze":"질문","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01478","ko":"수업이 끝나고 질문 시간이 있어요.","en":"After class there is question time.","speech_level":"해요","cloze":"질문","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11510","ko":"질문 있어요? — 네, 하나 있어요.","en":"Any questions? — Yes, I have one.","speech_level":"해요","cloze":"질문","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11511","ko":"이메일로 질문을 보냈어요.","en":"I sent my question by email.","speech_level":"해요","cloze":"질문","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11512","ko":"좋은 질문이에요. 잠깐만요.","en":"That's a good question. One moment.","speech_level":"해요","cloze":"질문","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"질문","roman":"jilmun","explain":"‘질문’은 사람에게 묻는 말이에요. 시험 문제는 ‘질문’이 아니라 ‘문제’라고 해요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"질문 사항.","en":"questions; matters to ask","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"질문을 받다.","en":"to receive a question","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"질문을 던지다.","en":"to throw out a question","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"질문에 답하다.","en":"to answer a question","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"질문이 있으신 분은 발표가 끝난 후에 해 주시기 바랍니다.","en":"Those who have questions, please ask after the presentation ends.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"질문 is a question you ask a person. A question on an exam is a 문제, not a 질문.","contract_en":""},{"id":"n00726","kind":"pattern","ko":"얼마예요?","yo":"","en":"How much is it?","pos":"문형","usage":"","contract":"","examples":[{"id":"e00313","ko":"이 우산 얼마예요?","en":"How much is this umbrella?","speech_level":"해요","cloze":"얼마예요","extra_word":"얼마 = how much","extra_grammar":"","tip":"","tip_en":""},{"id":"e00314","ko":"커피 한 잔에 얼마예요?","en":"How much is a cup of coffee?","speech_level":"해요","cloze":"얼마예요","extra_word":"얼마 = how much","extra_grammar":"","tip":"","tip_en":""}],"pron":"","roman":"","explain":"‘얼마예요?’는 값을 물을 때 써요. 여러 개를 한꺼번에 계산할 때는 ‘전부 얼마예요?’, 하나의 값은 ‘하나에 얼마예요?’라고 해요. 시간이나 거리를 물을 때는 ‘얼마나 걸려요?’처럼 ‘얼마나’를 써요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[{"ko":"전부 얼마예요?","en":"How much is it altogether?","src":"AI 생성 · 검수"},{"ko":"이 사과는 하나에 얼마예요?","en":"How much is one of these apples?","src":"AI 생성 · 검수"},{"ko":"택시비가 얼마예요? — 만 이천 원이에요.","en":"How much is the taxi fare? — 12,000 won.","src":"AI 생성 · 검수"}],"explain_en":"Use ‘얼마예요?’ to ask a price. For the total, say ‘전부 얼마예요?’; for the price of one, ‘하나에 얼마예요?’. To ask how long or how far, use ‘얼마나’, as in ‘얼마나 걸려요?’ (How long does it take?).","contract_en":""},{"id":"n00797","kind":"word","ko":"아프다","yo":"아파요","en":"to be sick / to hurt","pos":"형용사","usage":"","contract":"","examples":[{"id":"e01095","ko":"어제부터 머리가 아파요.","en":"I've had a headache since yesterday.","speech_level":"해요","cloze":"아파요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01096","ko":"감기에 걸려서 목이 아파요.","en":"I caught a cold, so my throat hurts.","speech_level":"해요","cloze":"아파요","extra_word":"목 = throat","extra_grammar":"","tip":"","tip_en":""},{"id":"e12743","ko":"허리가 아파요. 병원에 가야 해요.","en":"My back hurts. I have to go to the hospital.","speech_level":"해요","cloze":"아파요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e12744","ko":"많이 아파요? — 아니요, 조금만요.","en":"Does it hurt a lot? — No, just a little.","speech_level":"해요","cloze":"아파요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e12745","ko":"동생이 아파요. 오늘 학교에 못 가요.","en":"My younger sibling is sick. He can't go to school today.","speech_level":"해요","cloze":"아파요","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"아프다","roman":"apayo","explain":"아프다는 ㅡ가 빠져요: 아파요, 아팠어요. 아픈 곳에는 “이/가”를 써요: “배가 아파요”.","video_url":"","video_title":"","phrases":[{"ko":"배가 아프다","example":"친구가 일등이 돼서 배가 아파요.","en":"to be jealous (lit. one's stomach hurts)","nuance_ko":"질투가 날 때","source":"AI","nuance_en":"used when you feel jealous","en_equiv":"to be jealous (lit. one's stomach hurts)"},{"ko":"마음이 아프다","example":"친구 이야기를 들으니 마음이 아파요.","en":"to feel heartbroken, to feel sorry","nuance_ko":"슬프고 안타까울 때","source":"AI","nuance_en":"said when you feel sad and sorry for someone","en_equiv":"to feel heartbroken, to feel sorry"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"손바닥을 아프게 때리다.","en":"Hit the palm so it hurts.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"칼에 벤 자리가 아프다.","en":"The place cut by the knife hurts.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"매 맞은 자리가 아프다.","en":"The spot where I was hit hurts.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"바늘에 찔려 아프다.","en":"It hurts from being pricked by a needle.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"돌부리를 걷어차 발이 아프다.","en":"My foot hurts from kicking a rock.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"아프다 drops its ㅡ: 아파요, 아팠어요. The sore place takes 이/가: 배가 아파요 (“My stomach hurts”).","contract_en":""},{"id":"n00803","kind":"word","ko":"개발자","yo":"","en":"(software) developer","pos":"명사","usage":"","contract":"","examples":[{"id":"e01537","ko":"저는 개발자예요.","en":"I'm a developer.","speech_level":"해요","cloze":"개발자","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01538","ko":"제 남편은 게임 개발자예요.","en":"My husband is a game developer.","speech_level":"해요","cloze":"개발자","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08194","ko":"개발자는 회사에서 앱을 만들어요.","en":"A developer builds apps at a company.","speech_level":"해요","cloze":"개발자","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11675","ko":"개발자예요? — 아니요, 디자이너예요.","en":"Are you a developer? — No, I'm a designer.","speech_level":"해요","cloze":"개발자","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11676","ko":"우리 회사 개발자는 열 명이에요.","en":"There are ten developers at our company.","speech_level":"해요","cloze":"개발자","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"개발짜","roman":"gaebalja","explain":"“개발자”는 모음으로 끝나서 “개발자예요”가 돼요. “이에요”가 아니에요. 다른 직업도 마찬가지예요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":{"ch":[[2,"c","tense2",-1]],"rules":["tense2"],"long":[]},"dict_examples":[{"ko":"광산 개발자.","en":"a mine developer","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"개발자 ends in a vowel, so it takes 예요, not 이에요: 개발자예요. The same is true for most job words that end in a vowel.","contract_en":""},{"id":"n00809","kind":"word","ko":"호주","yo":"","en":"Australia","pos":"명사","usage":"","contract":"","examples":[{"id":"e01545","ko":"호주 사람이에요?","en":"Are you Australian?","speech_level":"해요","cloze":"호주","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01546","ko":"제 아내는 호주 사람이에요.","en":"My wife is Australian.","speech_level":"해요","cloze":"호주","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08420","ko":"호주에는 캥거루가 있어요.","en":"There are kangaroos in Australia.","speech_level":"해요","cloze":"호주","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08421","ko":"호주는 12월에 여름이에요.","en":"In Australia, December is summer.","speech_level":"해요","cloze":"호주","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08422","ko":"내년에 호주에서 영어를 공부해요.","en":"Next year I'll study English in Australia.","speech_level":"해요","cloze":"호주","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"호ː주","roman":"hoju","explain":"호주는 매일 쓰는 이름이에요. “오스트레일리아”는 긴 이름이에요. 둘 다 같은 나라예요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[],"explain_en":"호주 is the everyday name for Australia. 오스트레일리아 is the long, full name. Both mean t 저는 경찰이에요.","en":"I'm a police officer.","speech_level":"해요","cloze":"경찰","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01558","ko":"제 형은 경찰이에요.","en":"My older brother is a police officer.","speech_level":"해요","cloze":"경찰","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08200","ko":"경찰은 도둑을 잡아요.","en":"The police catch thieves.","speech_level":"해요","cloze":"경찰","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11685","ko":"저기 경찰이 있어요. 길을 물어볼까요?","en":"There's a police officer over there. Shall we ask for directions?","speech_level":"해요","cloze":"경찰","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11686","ko":"지갑이 없어요. 경찰에 전화할까요?","en":"My wallet is gone. Shall I call the police?","speech_level":"해요","cloze":"경찰","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"경찰","roman":"gyeongchal","explain":"“경찰”은 경찰관 한 사람도 되고, 경찰 전체도 돼요. 한국에서 경찰 전화번호는 112예요. 불이 났을 때는 119예요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[{"ko":"경찰에게 길을 묻다.","en":"to ask a police officer for directions","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"경찰이 범인을 검거하다.","en":"The police arrest the criminal.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"경찰이 음주 단속을 하려고 길목에 서 있다.","en":"Police are standing at a crossing to check for drunk driving.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"경찰 can mean one police officer or the police as a whole. In Korea the police number is 112; for fire and ambulance it is 119.","contract_en":""},{"id":"n00816","kind":"word","ko":"작가","yo":"","en":"writer; author","pos":"명사","usage":"","contract":"","examples":[{"id":"e01559","ko":"저는 작가예요.","en":"I'm a writer.","speech_level":"해요","cloze":"작가","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01560","ko":"제 친구는 웹툰 작가예요.","en":"My friend is a webtoon artist.","speech_level":"해요","cloze":"작가","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08201","ko":"작가는 집에서 책을 써요.","en":"A writer writes books at home.","speech_level":"해요","cloze":"작가","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11689","ko":"이 작가 책을 좋아해요.","en":"I like this author's books.","speech_level":"해요","cloze":"작가","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11690","ko":"서점에서 작가를 만났어요.","en":"I met an author at the bookstore.","speech_level":"해요","cloze":"작가","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"작까","roman":"jakga","explain":"책을 쓰는 사람만 “작가”가 아니에요. 웹툰, 드라마 대본, 사진을 만드는 사람도 작가예요. 앞에 분야를 붙여요. 웹툰 작가, 사진작가처럼요.","video_url":"","video_title":"","phrases":[],"pron_source":"curriculum","pron_why":{"ch":[[1,"c","tense",-1]],"rules":["tense"],"long":[]},"dict_examples":[{"ko":"시나리오 작가.","en":"a screenwriter","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"젊은 작가들을 모아 전시회를 열다.","en":"to gather young artists and hold an exhibition","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"이 소설에는 작가의 사상과 감정이 잘 나타나 있다.","en":"The author's thoughts and feelings are well expressed in this novel.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"작가 is not only for book writers. People who make webtoons, drama scripts or photographs are also called 작가. Put the field first: 웹툰 작가, 사진작가.","contract_en":""},{"id":"n00817","kind":"word","ko":"기자","yo":"","en":"reporter; journalist","pos":"명사","usage":"","contract":"","examples":[{"id":"e01561","ko":"기자예요? — 네, 맞아요.","en":"Are you a reporter? — Yes, that's right.","speech_level":"해요","cloze":"기자","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01562","ko":"제 친구는 신문 기자예요.","en":"My friend is a newspaper reporter.","speech_level":"해요","cloze":"기자","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08202","ko":"기자는 매일 신문 기사를 써요.","en":"A reporter writes newspaper articles every day.","speech_level":"해요","cloze":"기자","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11691","ko":"기자는 질문을 많이 해요.","en":"Reporters ask a lot of questions.","speech_level":"해요","cloze":"기자","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11692","ko":"텔레비전에 기자가 나와요.","en":"A reporter is on TV.","speech_level":"해요","cloze":"기자","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"기자","roman":"gija","explain":"“기자”는 사람이고, “기사”는 신문에 나오는 글이에요. 소리가 비슷하니까 조심하세요. 기자가 기사를 써요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"정치부 기자.","en":"a political desk reporter","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그 기자의 기사는 예리하기로 정평이 나 있다.","en":"That reporter's articles are well known for being sharp.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"대선에 관한 기자들의 취재 경쟁이 뜨겁다.","en":"Reporters are competing fiercely to cover the presidential election.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"기자 is the person, and 기사 is the article. They sound alike, so be careful: 기자가 기사를 써요.","contract_en":""},{"id":"n00831","kind":"word","ko":"동료","yo":"","en":"colleague; co-worker","pos":"명사","usage":"","contract":"","examples":[{"id":"e01585","ko":"벤은 제 동료예요.","en":"Ben is my coworker.","speech_level":"해요","cloze":"동료","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01586","ko":"그 사람은 회사 동료예요.","en":"He's a colleague from work.","speech_level":"해요","cloze":"동료","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08203","ko":"동료는 회사에서 저하고 같이 일해요.","en":"A colleague works together with me at the company.","speech_level":"해요","cloze":"동료","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e08501","ko":"제 동료는 한국 사람이에요.","en":"My colleague is Korean.","speech_level":"해요","cloze":"동료","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08502","ko":"동료예요? — 아니요, 제 친구예요.","en":"Is that a colleague? — No, he's my friend.","speech_level":"해요","cloze":"동료","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"동뇨","roman":"dongnyo","explain":"동료는 다른 사람에게 소개할 때 쓰는 말이에요. 직접 부를 때는 “동료!”라고 하지 않고 이름에 “씨”나 직함을 붙여요.","video_url":"","video_title":"","phrases":[],"pron_source":"curriculum","pron_why":{"ch":[[1,"c","nasal_l",-1]],"rules":["nasal_l"],"long":[]},"dict_examples":[{"ko":"직장 동료.","en":"a coworker","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"동료 is a word for introducing or describing a co-worker. You do not call someone 동료 to their face; use their name plus 씨, or their job title.","contract_en":""},{"id":"n00840","kind":"word","ko":"교수님","yo":"","en":"professor (respectful)","pos":"명사","usage":"","contract":"","examples":[{"id":"e01602","ko":"교수님, 질문이 있어요.","en":"Professor, I have a question.","speech_level":"해요","cloze":"교수님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01603","ko":"교수님 수업은 월요일이에요.","en":"The professor's class is on Monday.","speech_level":"해요","cloze":"교수님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08205","ko":"교수님은 대학교에서 한국 역사를 가르쳐요.","en":"The professor teaches Korean history at the university.","speech_level":"해요","cloze":"교수님","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e08529","ko":"교수님, 안녕하세요?","en":"Hello, professor.","speech_level":"해요","cloze":"교수님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08530","ko":"여기 교수님 방이에요? — 네, 맞아요.","en":"Is this the professor's office? — Yes, that's right.","speech_level":"해요","cloze":"교수님","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"교수님","roman":"gyosunim","explain":"교수님은 직접 부를 때 “교수님”이라고만 해도 돼요. 이름을 부르는 건 예의가 아니에요. 이름을 말할 때는 “김 교수님”처럼 성 뒤에 붙여요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[{"ko":"대학 시절 수업 시간에 한 교수님이 사람들은 왜 지나간 시절을 다 아름답다고 생각하는지 아느냐고 물으신 적이 있다.","en":"In my university days, a professor once asked in class if we knew why people think all past times are beautiful.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"To call a professor directly, just say 교수님. Never use their name alone. When you mention one by name, add 교수님 after the family name, like 김 교수님.","contract_en":""},{"id":"n00864","kind":"word","ko":"공무원","yo":"","en":"public official","pos":"명사","usage":"","contract":"","examples":[{"id":"e01650","ko":"소방관은 공무원이에요.","en":"Firefighters are civil servants.","speech_level":"해요","cloze":"공무원","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01651","ko":"제 언니는 회사원이 아니에요. 공무원이에요.","en":"My sister isn't a company employee. She's a civil servant.","speech_level":"해요","cloze":"공무원","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08206","ko":"공무원은 시청에서 일해요.","en":"Public officials work at city hall.","speech_level":"해요","cloze":"공무원","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11701","ko":"친구가 공무원 시험을 준비해요.","en":"My friend is preparing for the civil service exam.","speech_level":"해요","cloze":"공무원","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11702","ko":"공무원이에요? — 네, 구청에서 일해요.","en":"Are you a civil servant? — Yes, I work at the district office.","speech_level":"해요","cloze":"공무원","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"공무원","roman":"gongmuwon","explain":"한국에서는 공무원 시험을 준비하는 사람이 많아요. 시청, 구청, 경찰서, 학교에서 일하는 사람도 공무원이에요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"공무원으로 일하다.","en":"to work as a civil servant","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"공무원은 공개경쟁 채용 시험으로 채용한다.","en":"Civil servants are hired through open competitive exams.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Many people in Korea study for the civil service exam. People working at city halls, district offices, police stations and public schools are 공무원 too.","contract_en":""},{"id":"n00865","kind":"word","ko":"소방관","yo":"","en":"firefighter","pos":"명사","usage":"","contract":"","examples":[{"id":"e01652","ko":"제 친구는 경찰이 아니에요. 소방관이에요.","en":"My friend isn't a police officer. He's a firefighter.","speech_level":"해요","cloze":"소방관","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01653","ko":"제 남동생은 소방관이에요.","en":"My younger brother is a firefighter.","speech_level":"해요","cloze":"소방관","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08207","ko":"소방관은 불을 꺼요.","en":"Firefighters put out fires.","speech_level":"해요","cloze":"소방관","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11699","ko":"소방관이 아이를 구해요.","en":"The firefighter rescues the child.","speech_level":"해요","cloze":"소방관","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11700","ko":"119에 전화해요. 소방관이 빨리 와요.","en":"I call 119. The firefighters come quickly.","speech_level":"해요","cloze":"소방관","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"소방관","roman":"sobanggwan","explain":"“-관”은 공무원 직업 이름에 자주 붙어요. 소방관, 경찰관, 외교관이 그래요. “관”은 나라 일을 하는 사람이라는 느낌이에요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"신고를 받고 출동한 소방관들은 현장에 도착해 화재를 진압했다.","en":"Firefighters dispatched after a report arrived at the scene and put out the fire.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그는 교통사고를 당해서 쓰러져 있었는데, 다행히 소방관의 도움으로 구조되었다.","en":"He was lying collapsed after a traffic accident, but was fortunately rescued with a firefighter's help.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"The ending -관 is common in public-service jobs: 소방관, 경찰관, 외교관. It suggests someone doing work for the state.","contract_en":""},{"id":"n00866","kind":"word","ko":"바리스타","yo":"","en":"barista","pos":"명사","usage":"","contract":"","examples":[{"id":"e01654","ko":"니코는 바리스타예요.","en":"Niko is a barista.","speech_level":"해요","cloze":"바리스타","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01655","ko":"저는 이 카페 바리스타예요.","en":"I'm a barista at this café.","speech_level":"해요","cloze":"바리스타","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08208","ko":"바리스타는 카페에서 커피를 만들어요.","en":"A barista makes coffee at a café.","speech_level":"해요","cloze":"바리스타","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11697","ko":"바리스타가 에스프레소를 내려요.","en":"The barista brews an espresso.","speech_level":"해요","cloze":"바리스타","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11698","ko":"저 바리스타는 라테를 정말 잘 만들어요.","en":"That barista makes really good lattes.","speech_level":"해요","cloze":"바리스타","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"바리스타","roman":"bariseuta","explain":"카페에서 일하는 사람은 “직원”이라고 해요. 커피를 전문으로 만드는 사람은 “바리스타”라고 해요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"A person working in a cafe is a 직원 (staff member). Someone who specializes in making coffee is a 바리스타.","contract_en":""},{"id":"n00867","kind":"word","ko":"엔지니어","yo":"","en":"engineer","pos":"명사","usage":"","contract":"","examples":[{"id":"e01656","ko":"루카스는 엔지니어예요.","en":"Lucas is an engineer.","speech_level":"해요","cloze":"엔지니어","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01657","ko":"제 친구는 자동차 엔지니어예요.","en":"My friend is an automotive engineer.","speech_level":"해요","cloze":"엔지니어","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08209","ko":"엔지니어는 회사에서 기계를 만들어요.","en":"An engineer builds machines at a company.","speech_level":"해요","cloze":"엔지니어","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11695","ko":"공장 엔지니어가 기계를 고쳐요.","en":"The factory engineer fixes the machine.","speech_level":"해요","cloze":"엔지니어","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11696","ko":"엔지니어예요? — 네, 소프트웨어 회사에서 일해요.","en":"Are you an engineer? — Yes, I work at a software company.","speech_level":"해요","c {"id":"e11716","ko":"택시 운전기사는 서울 길을 잘 알아요.","en":"Taxi drivers know the Seoul roads well.","speech_level":"해요","cloze":"운전기사","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11717","ko":"운전기사가 버스 문을 열어요.","en":"The driver opens the bus door.","speech_level":"해요","cloze":"운전기사","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"운ː전기사","roman":"unjeongisa","explain":"택시나 버스를 탔을 때 운전기사를 “기사님”이라고 불러요. 예를 들면 “기사님, 여기서 내려 주세요.”라고 말해요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"이번 사고로 버스를 몰던 운전기사와 승객 8명이 크게 다쳤다.","en":"In this accident, the bus driver and eight passengers were seriously injured.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"택시에 오른 어머니가 운전기사에게 행선지를 일러 주고 나서 떠올린 것도 그런 것이었다.","en":"That was also what Mother thought of after getting in the taxi and telling the driver the destination.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"When you ride a taxi or bus, you call the driver 기사님. For example: 기사님, 여기서 내려 주세요 (Please let me off here).","contract_en":""},{"id":"n00872","kind":"word","ko":"미용사","yo":"","en":"hairdresser","pos":"명사","usage":"","contract":"","examples":[{"id":"e01666","ko":"제 친구는 미용사예요.","en":"My friend is a hairdresser.","speech_level":"해요","cloze":"미용사","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01667","ko":"제 이모는 미용사예요.","en":"My aunt is a hairdresser.","speech_level":"해요","cloze":"미용사","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08213","ko":"미용사는 미용실에서 머리를 잘라요.","en":"A hairdresser cuts hair at the salon.","speech_level":"해요","cloze":"미용사","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11707","ko":"미용사가 손님 머리를 파마해요.","en":"The hairdresser perms the customer's hair.","speech_level":"해요","cloze":"미용사","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11708","ko":"미용실에 미용사가 세 명 있어요.","en":"There are three hairdressers at the salon.","speech_level":"해요","cloze":"미용사","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"미ː용사","roman":"miyongsa","explain":"미용실에서는 머리를 하는 사람을 “디자이너”라고 부르기도 해요. “미용사”는 직업 이름이에요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"우리 동네 미용실의 미용사는 나에게는 짧은 생머리가 어울린다며 머리를 자르라고 권했다.","en":"The hairdresser at my neighborhood salon said short straight hair suits me and suggested I cut it.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"어깨까지 닿는 긴 머리를 자르고 짧은 스타일로 바꿔 보지 않겠느냐고 미용사가 권했지만 나는 거절했다.","en":"The hairdresser suggested I cut my shoulder-length hair short, but I declined.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"In a hair salon, the person who does your hair is sometimes called a 디자이너. 미용사 is the name of the profession.","contract_en":""},{"id":"n00873","kind":"word","ko":"은행원","yo":"","en":"bank employee","pos":"명사","usage":"","contract":"","examples":[{"id":"e01668","ko":"도현은 은행원이에요.","en":"Dohyun works at a bank.","speech_level":"해요","cloze":"은행원","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01669","ko":"제 아내는 은행원이 아니에요. 약사예요.","en":"My wife isn't a bank teller. She's a pharmacist.","speech_level":"해요","cloze":"은행원","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08214","ko":"은행원은 은행에서 손님을 도와요.","en":"A bank employee helps customers at the bank.","speech_level":"해요","cloze":"은행원","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11703","ko":"은행원은 하루 종일 컴퓨터 앞에서 일해요.","en":"Bank clerks work in front of a computer all day.","speech_level":"해요","cloze":"은행원","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11704","ko":"제 친구는 은행원이에요. 이 근처 은행에서 일해요.","en":"My friend is a bank clerk. She works at a bank near here.","speech_level":"해요","cloze":"은행원","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"은행원","roman":"eunhaengwon","explain":"“-원”은 어느 곳의 일원이라는 뜻이에요. 은행원, 회사원, 공무원, 연구원처럼 많이 써요. 모두 사람이에요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"112번 손님, 112번 손님. 창구에서 손님을 부르는 은행원의 상냥한 목소리가 들려왔다.","en":"\"Customer number 112, customer number 112.\" The gentle voice of a bank clerk calling a customer at the counter was heard.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"The ending -원 means a member of some organization: 은행원, 회사원, 공무원, 연구원. All of them are people.","contract_en":""},{"id":"n00876","kind":"word","ko":"교수","yo":"","en":"professor","pos":"명사","usage":"","contract":"","examples":[{"id":"e01674","ko":"저는 대학교 교수예요.","en":"I'm a university professor.","speech_level":"해요","cloze":"교수","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01675","ko":"제 남편은 대학교 교수예요.","en":"My husband is a university professor.","speech_level":"해요","cloze":"교수","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08215","ko":"교수는 대학교에서 수업을 해요.","en":"A professor teaches classes at a university.","speech_level":"해요","cloze":"교수","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11711","ko":"교수님, 질문이 하나 있어요.","en":"Professor, I have one question.","speech_level":"해요","cloze":"교수","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11712","ko":"저는 교수가 되고 싶어요. 대학교에서 일하고 싶어요.","en":"I want to become a professor. I want to work at a university.","speech_level":"해요","cloze":"교수","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"교수","roman":"gyosu","explain":"대학교에서는 선생님보다 “교수님”이라고 불러요. 이름 뒤에도 붙여요. “김 교수님”처럼요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[{"ko":"교수는 연구와 강의에 충실해야 하는데, 연구가 부실하면 강의도 자연 부실해진다.","en":"A professor must be dedicated to research and teaching, and if research is weak, teaching naturally becomes weak too.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"At a university you call a professor 교수님 rather than 선생님. You can add it after a family name too: 김 교수님.","contract_en":""},{"id":"n00877","kind":"word","ko":"사장","yo":"","en":"business owner / boss","pos":"명사","usage":"","contract":"","examples":[{"id":"e01676","ko":"저는 사장이 아니에요. 직원이에요.","en":"I'm not the owner. I'm an employee.","speech_level":"해요","cloze":"사장","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01677","ko":"저는 이 식당 사장이에요.","en":"I own this restaurant.","speech_level":"해요","cloze":"사장","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08216","ko":"사장은 매달 월급을 줘요.","en":"The boss pays salaries every month.","speech_level":"해요","cloze":"사장","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e08709","ko":"제 친구는 가게 사장이에요.","en":"My friend is a shop owner.","speech_level":"해요","cloze":"사장","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08710","ko":"저 사람이 사장이에요? — 아니요, 직원이에요.","en":"Is that person the boss? — No, he's an employee.","speech_level":"해요","cloze":"사장","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"사장","roman":"sajang","explain":"“사장”은 직함이고, 부르거나 높여서 말할 때는 “사장님”이라고 해요. 성 뒤에는 “김 사장님”처럼 붙여요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[],"explain_en":"사장 is the title; when you call or talk about the boss respectfully, say 사장님. After a family name: 김 사장님.","contract_en":""},{"id":"n00882","kind":"word","ko":"일하다","yo":"일해요","en":"work","pos":"동사","usage":"","contract":"","examples":[{"id":"e01686","ko":"지금 일해요.","en":"I'm working now.","speech_level":"해요","cloze":"일해요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01687","ko":"동생은 요즘 열심히 일해요.","en":"My younger sibling is working hard these days.","speech_level":"해요","cloze":"일해요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08765","ko":"친구는 호텔에서 일해요.","en":"My friend works at a hotel.","speech_level":"해요","cloze":"일해요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08766","ko":"저는 서울 은행에서 일해요.","en":"I work at a bank in Seoul.","speech_level":"해요","cloze":"일해요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08767","ko":"주말에도 일해요? — 아니요, 쉬어요.","en":"Do you work on weekends too? — No, I rest.","speech_level":"해요","cloze":"일해요","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"일ː하다","roman":"ilhaeyo","explain":"일하는 곳에는 “에서”를 써요: 회사에서 일해요. “회사에 일해요”는 틀려요.","video_url":"","video_title":"","phrases":[{"ko":"일벌레","example":"제 친구는 일벌레예요. 주말에도 일해요.","en":"workaholic","nuance_ko":"일만 하는 사람 (조금 놀리는 말)","source":"AI","nuance_en":"a person who only works (said as a mild tease)","en_equiv":"workaholic"},{"ko":"일이 손에 안 잡히다","example":"걱정이 많아서 일이 손에 안 잡혀요.","en":"to be unable to focus on work","nuance_ko":"걱정이나 설렘 때문에 집중이 안 될 때","source":"AI","nuance_en":"said when worry or excitement keeps you from concentrating","en_equiv":"to be unable to focus on work"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"열심히 일한 대가.","en":"the reward for working hard","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"주방에서 일하는 아줌마.","en":"the woman who works in the kitchen","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"땀 흘려 일하다.","en":"to work sweating","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"나는 졸업 후에 작은 회사에서 일하게 되었다.","en":"After graduating, I came to work at a small company.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"건설 현장에서 감독으로 일하고 있다.","en":"He works as a supervisor at a construction site.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"함께 일해 봅시다.","en":"Let's work together.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Use 에서 for the place where you work: 회사에서 일해요. “회사에 일해요” is wrong.","contract_en":""},{"id":"n00890","kind":"word","ko":"드라마","yo":"","en":"TV drama (series)","pos":"명사","usage":"","contract":"","examples":[{"id":"e01701","ko":"제 동생은 지금 드라마 봐요.","en":"My younger sibling is watching a drama now.","speech_level":"해요","cloze":"드라마","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01702","ko":"저는 요즘 한국 드라마 봐요.","en":"I'm watching Korean dramas these days.","speech_level":"해요","cloze":"드라마","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08858","ko":"이 드라마는 정말 재미있어요. 같이 봐요.","en":"This drama is really fun. Let's watch it together.","speech_level":"해요","cloze":"드라마","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08859","ko":"언니는 밤마다 드라마를 봐요. 저는 영화를 봐요.","en":"My older sister watches dramas every night. I watch movies.","speech_level":"해요","cloze":"드라마","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08860","ko":"한국 드라마는 인기가 많아요.","en":"Korean dramas are very popular.","speech_level":"해요","cloze":"드라마","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"드라마","roman":"deurama","explain":"드라마 에피소드는 “회”로 세요: 첫 회, 마지막 회. 드라마를 처음부터 끝까지 쭉 보는 것을 “정주행”이라고 해요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[{"ko":"그 드라마는 시청률이 높다.","en":"That drama has high ratings.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그는 드라마 연출가이다.","en":"He is a drama director.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"드라마를 쓰다.","en":"to write a drama","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Episodes of a drama are counted with 회: 첫 회 (first episode), 마지막 회 (last). Watching a whole series from the start to the end is called 정주행.","contract_en":""},{"id":"n00991","kind":"expression","ko":"주세요","yo":"","en":"please give me (after a noun); …, please","pos":"표현","usage":"","contract":"","examples":[{"id":"e01876","ko":"물 주세요.","en":"Water, please.","speech_level":"해요","cloze":"주세요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e07569","ko":"저기요, 영수증 주세요.","en":"Excuse me, could I have the receipt?","speech_level":"해요","cloze":"주세요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09710","ko":"이거 주세요.","en":"I'll take this, please.","speech_level":"해요","cloze":"주세요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09711","ko":"아저씨, 이 우유 주세요.","en":"Excuse me, I'd like this milk, please.","speech_level":"해요","cloze":"주세요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09712","ko":"친구 생일이에요. 케이크 주세요.","en":"It's my friend's birthday. A cake, please.","speech_level":"해요","cloze":"주세요","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"주세요","roman":"juseyo","explain":"가게에서는 “물 주세요”처럼 조사 없이 짧게 말해요. “물을 주세요”도 맞지만 덜 자주 써요. “좀”을 넣으면 더 부드러워요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"In shops people say it short and without a particle: 물 주세요. 물을 주세요 is also correct but used less. Adding 좀 makes it softer.","contract_en":""},{"id":"n00992","kind":"expression","ko":"여기요","yo":"","en":"excuse me (to call staff)","pos":"표현","usage":"","contract":"","examples":[{"id":"e01877","ko":"여기요. 메뉴판 주세요.","en":"Excuse me. Could I have the menu?","speech_level":"해요","cloze":"여기요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e07776","ko":"여기요, 물 좀 주세요.","en":"Excuse me, could we get some water?","speech_level":"해요","cloze":"여기요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09719","ko":"여기요, 숟가락이 없어요.","en":"Excuse me, I don't have a spoon.","speech_level":"해요","cloze":"여기요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09720","ko":"여기요! 김치 좀 더 주세요.","en":"Excuse me! More kimchi, please.","speech_level":"해요","cloze":"여기요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09721","ko":"여기요, 화장실이 어디에 있어요?","en":"Excuse me, where is the restroom?","speech_level":"해요","cloze":"여기요","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"여기요","roman":"yeogiyo","explain":"식당이나 카페에서 직원을 부를 때 “여기요”라고 해요. 손을 들고 불러도 괜찮아요. 호출 벨이 있는 식당에서는 벨을 눌러요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[{"ko":"여기요, 주문할게요.","en":"Excuse me, I'd like to order.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Use 여기요 to call a waiter or staff member in a restaurant or cafe. It is fine to raise your hand while you say it. Where there is a call button on the table, press it.","contract_en":""},{"id":"n01027","kind":"word","ko":"계산","yo":"","en":"payment; checkout","pos":"명사","usage":"","contract":"","examples":[{"id":"e01935","ko":"계산은 저기에서 해요.","en":"You pay over there.","speech_level":"해요","cloze":"계산","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01936","ko":"오늘 계산은 제가 해요.","en":"I'll pay today.","speech_level":"해요","cloze":"계산","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e10247","ko":"계산은 카운터에서 해요.","en":"You pay at the counter.","speech_level":"해요","cloze":"계산","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e10248","ko":"이거 계산이 맞아요? — 네, 맞아요.","en":"Is this bill right? — Yes, it's right.","speech_level":"해요","cloze":"계산","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e10249","ko":"차 한 잔 마셔요. 계산은 나중에 해요.","en":"Let's have a cup of tea. We'll pay later.","speech_level":"해요","cloze":"계산","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"계ː산","roman":"gyesan","explain":"계산은 돈을 낼 때도 쓰고 수학 계산에도 써요. 식당에서는 나갈 때 입구에서 계산해요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"계산을 치르고 호텔을 떠났다.","en":"I paid the bill and left the hotel.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그럼 잠깐만 기다리시겠어요? 계산만 치르고 나오겠어요.","en":"Then would you wait a moment? I'll just pay the bill and come out.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"이자 계산을 하다.","en":"To calculate interest.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"계산이 정확하고 빠르다.","en":"The calculation is accurate and fast.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그는 숫자와 관련된 계산에 약하다.","en":"He is weak at calculations involving numbers.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"계산 is used both for paying a bill and for doing math. In a restaurant you usually pay at the counter by the door on your way out.","contract_en":""},{"id":"n01352","kind":"word","ko":"약","yo":"","en":"medicine","pos":"명사","usage":"","contract":"","examples":[{"id":"e02523","ko":"약은 점심에 먹어야 해요.","en":"I have to take the medicine at lunch.","speech_level":"해요","cloze":"약","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e02524","ko":"밥을 먹고 약을 먹어야 해요.","en":"I have to take my medicine after eating.","speech_level":"해요","cloze":"약","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e10944","ko":"약국에서 약을 샀어요.","en":"I bought medicine at the pharmacy.","speech_level":"해요","cloze":"약을","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e10945","ko":"이 약은 하루에 세 번 먹어요.","en":"You take this medicine three times a day.","speech_level":"해요","cloze":"약","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e10946","ko":"약을 먹고 푹 쉬세요.","en":"Take your medicine and get a good rest.","speech_level":"해요","cloze":"약","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"약","roman":"yak","explain":"약은 알약도 물약도 ‘먹다’를 써요: 약을 먹어요. 약을 사는 곳은 ‘약국’이에요. ‘약 열 명’처럼 숫자 앞에 오는 ‘약’(about)은 소리만 같은 다른 말이에요.","video_url":"","video_title":"","phrases":[{"ko":"좋은 약은 입에 쓰다","example":"좋은 약은 입에 쓰다고 하잖아요.","en":"good medicine tastes bitter (good advice is hard to hear)","nuance_ko":"충고 들을 때 써요","source":"AI","nuance_en":"a saying used when you hear advice that is hard to take but good for you","en_equiv":"good medicine tastes bitter (good advice is hard to hear)"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"약을 먹다.","en":"Take medicine.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"약을 바르다.","en":"Apply ointment.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"약을 조제하다.","en":"Prepare a prescription.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"약을 짓다.","en":"Have medicine made up.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"병으로 몸져눕게 되었으나 돈이 없어 약을 쓰지 못하고 있다.","en":"He has fallen ill and bedridden but has no money to buy medicine.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Whether pills or liquid, Koreans use '먹다' for medicine: 약을 먹어요. You buy medicine at a '약국' (pharmacy). The '약' before numbers, as in '약 열 명' (about ten people), is a different word that sounds the same.","contract_en":""},{"id":"n04128","kind":"word","ko":"사돈","yo":"","en":"in-laws (your child's spouse's parents)","pos":"명사","usage":"사돈 = the parents of your son- or daughter-in-law (both families call each other 사돈).","contract":"","examples":[{"id":"e08234","ko":"사돈이 대전에 살아요.","en":"My in-laws live in Daejeon.","speech_level":"해요","cloze":"사돈","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08235","ko":"다음 주에 사돈을 만나요.","en":"I'm meeting my in-laws next week.","speech_level":"해요","cloze":"사돈","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11895","ko":"아들 결혼식에서 사돈을 처음 만났어요.","en":"I met my son's in-laws for the first time at his wedding.","speech_level":"해요","cloze":"사돈","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11896","ko":"내일 사돈하고 점심 먹을 거예요.","en":"I'm going to have lunch with my child's in-laws tomorrow.","speech_level":"해요","cloze":"사돈","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11897","ko":"사돈 집이 우리 집 근처예요.","en":"My child's in-laws live near our house.","speech_level":"해요","cloze":"사돈","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"사돈","roman":"sadon","explain":"사돈을 직접 부를 때는 ‘사돈어른’이라고 많이 해요. 아주 정중한 말이에요.","video_url":"","video_title":"","phrases":[{"ko":"사돈의 팔촌","example":"그 사람은 사돈의 팔촌 정도로 먼 친척이에요.","en":"a very distant relative (or near-stranger)","nuance_ko":"아주 먼 관계","source":"AI","nuance_en":"a very distant relationship","en_equiv":"a very distant relative (or near-stranger)"},{"ko":"사돈 남 말 하네","example":"자기도 늦으면서 사돈 남 말 하네.","en":"look who's talking","nuance_ko":"구어, 자기 잘못은 모르고 남을 탓할 때","source":"AI","nuance_en":"casual: said when someone blames others without noticing their own fault","en_equiv":"look who's talking"}],"pron_source":"auto","pron_why":null,"dict_examples":[{"ko":"사돈을 맺다.","en":"To become in-laws.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"이쪽은 저희 사돈이십니다.","en":"This is our in-law (the parent of our child's spouse).","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"When you speak to your 사돈 directly, people often say 사돈어른. It is a very polite form.","contract_en":""},{"id":"n04129","kind":"word","ko":"손주","yo":"","en":"grandchild","pos":"명사","usage":"손주 = grandchild (any). 손자 = grandson, 손녀 = granddaughter.","contract":"","examples":[{"id":"e08236","ko":"손주가 둘 있어요.","en":"I have two grandchildren.","speech_level":"해요","cloze":"손주","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08237","ko":"이거 손주 사진이에요.","en":"This is a photo of my grandchild.","speech_level":"해요","cloze":"손주","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11898","ko":"주말마다 손주하고 공원에 가요.","en":"Every weekend I go to the park with my grandchild.","speech_level":"해요","cloze":"손주","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11899","ko":"손주 생일에 장난감을 샀어요.","en":"I bought a toy for my grandchild's birthday.","speech_level":"해요","cloze":"손주","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11900","ko":"우리 손주는 다섯 살이에요.","en":"Our grandchild is five years old.","speech_level":"해요","cloze":"손주","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"손주","roman":"sonju","explain":"아들의 아이는 ‘친손주’, 딸의 아이는 ‘외손주’라고 해요. 둘 다 그냥 ‘손주’라고 해도 돼요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[{"ko":"요즘 손주들 보는 재미에 푹 빠졌다.","en":"These days I'm completely absorbed in the joy of watching my grandchildren.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"A son's child is a 친손주 and a daughter's child is a 외손주. You can just say 손주 for both.","contract_en":""},{"id":"n04130","kind":"word","ko":"팬","yo":"","en":"fan (of a singer, a team)","pos":"명사","usage":"","contract":"","examples":[{"id":"e08238","ko":"저는 그 가수 팬이에요.","en":"I'm a fan of that singer.","speech_level":"해요","cloze":"팬","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08239","ko":"팬 사인회에 가요.","en":"I'm going to a fan signing event.","speech_level":"해요","cloze":"팬","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11901","ko":"동생은 야구 팬이에요.","en":"My younger brother is a baseball fan.","speech_level":"해요","cloze":"팬","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11902","ko":"팬들이 공연장 앞에서 기다려요.","en":"The fans are waiting in front of the concert hall.","speech_level":"해요","cloze":"팬","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11903","ko":"팬 카페에서 친구를 많이 만났어요.","en":"I made a lot of friends in the fan café.","speech_level":"해요","cloze":"팬","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"팬","roman":"paen","explain":"팬이 여러 명이면 ‘팬들’이에요. 팬들의 모임이나 문화는 ‘팬덤’이라고 해요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[{"ko":"우리 오빠는 축구 팬이라서 주말마다 경기장에 가요.","en":"My brother is a soccer fan, so he goes to the stadium every weekend.","src":"AI 생성 · 검수"}],"explain_en":"Several fans are 팬들. The community or culture of fans is called 팬덤 (fandom).","contract_en":""},{"id":"n04131","kind":"word","ko":"환자","yo":"","en":"patient (in a hospital)","pos":"명사","usage":"","contract":"","examples":[{"id":"e08240","ko":"오늘은 환자가 많아요.","en":"There are many patients today.","speech_level":"해요","cloze":"환자","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08241","ko":"이 환자는 어디가 아파요?","en":"Where does this patient hurt?","speech_leve ,"video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"People in Brazil speak Portuguese, not Spanish. Brazil is the big Portuguese-speaking country in South America.","contract_en":""},{"id":"n04134","kind":"word","ko":"스페인","yo":"","en":"Spain","pos":"명사","usage":"","contract":"","examples":[{"id":"e08246","ko":"저는 스페인 사람이에요.","en":"I'm Spanish.","speech_level":"해요","cloze":"스페인","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08247","ko":"스페인에 가고 싶어요.","en":"I want to go to Spain.","speech_level":"해요","cloze":"스페인","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11748","ko":"스페인은 여름에 아주 더워요.","en":"Spain is very hot in summer.","speech_level":"해요","cloze":"스페인","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11749","ko":"스페인 음식을 좋아해요? — 네, 파에야를 좋아해요.","en":"Do you like Spanish food? — Yes, I like paella.","speech_level":"해요","cloze":"스페인","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11750","ko":"스페인에서 축구 경기를 봤어요.","en":"I watched a soccer match in Spain.","speech_level":"해요","cloze":"스페인","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"스페인","roman":"seupein","explain":"“에스파냐”라는 이름도 있어요. 하지만 보통은 “스페인”이라고 말해요. 말은 “스페인어”예요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"It also has the name “에스파냐”. But people usually say “스페인”. The language is “스페인어”.","contract_en":""},{"id":"n04135","kind":"word","ko":"멕시코","yo":"","en":"Mexico","pos":"명사","usage":"","contract":"","examples":[{"id":"e08248","ko":"저는 멕시코 사람이에요.","en":"I'm Mexican.","speech_level":"해요","cloze":"멕시코","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08249","ko":"멕시코에 가고 싶어요.","en":"I want to go to Mexico.","speech_level":"해요","cloze":"멕시코","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11751","ko":"멕시코 음식점에서 타코를 먹어요.","en":"I eat tacos at a Mexican restaurant.","speech_level":"해요","cloze":"멕시코","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11752","ko":"멕시코 친구가 서울에 살아요.","en":"My Mexican friend lives in Seoul.","speech_level":"해요","cloze":"멕시코","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11753","ko":"멕시코는 사람이 정말 많아요.","en":"Mexico has a really large population.","speech_level":"해요","cloze":"멕시코","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"멕씨코","roman":"meksiko","explain":"“멕시코”는 [멕씨코]로 소리 나요. ㄱ 받침 뒤의 ㅅ이 된소리가 돼요. 글자는 “시”인데 [씨]로 말해요.","video_url":"","video_title":"","phrases":[],"pron_source":"curriculum","pron_why":{"ch":[[1,"c","tense",-1]],"rules":["tense"],"long":[]},"dict_examples":[],"explain_en":"“멕시코” is pronounced [멕씨코]. After a ㄱ final consonant, ㅅ becomes a tense sound. It's written “시” but said [씨].","contract_en":""},{"id":"n04136","kind":"word","ko":"이탈리아","yo":"","en":"Italy","pos":"명사","usage":"","contract":"","examples":[{"id":"e08250","ko":"저는 이탈리아 사람이에요.","en":"I'm Italian.","speech_level":"해요","cloze":"이탈리아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08251","ko":"이탈리아에 가고 싶어요.","en":"I want to go to Italy.","speech_level":"해요","cloze":"이탈리아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11754","ko":"이탈리아 식당에서 피자를 먹어요.","en":"I eat pizza at an Italian restaurant.","speech_level":"해요","cloze":"이탈리아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11755","ko":"이탈리아 친구는 커피를 아주 좋아해요.","en":"My Italian friend loves coffee.","speech_level":"해요","cloze":"이탈리아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11756","ko":"이탈리아 신발을 샀어요. 정말 편해요.","en":"I bought Italian shoes. They are really comfortable.","speech_level":"해요","cloze":"이탈리아","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"이탈리아","roman":"itallia","explain":"예전 이름 “이태리”를 아직도 가끔 들을 수 있어요. 지금 이름은 “이탈리아”예요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"You may still sometimes hear the old name “이태리”. The current name is “이탈리아”.","contract_en":""},{"id":"n04137","kind":"word","ko":"인도","yo":"","en":"India","pos":"명사","usage":"","contract":"","examples":[{"id":"e08252","ko":"저는 인도 사람이에요.","en":"I'm Indian.","speech_level":"해요","cloze":"인도","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08253","ko":"인도에 가고 싶어요.","en":"I want to go to India.","speech_level":"해요","cloze":"인도","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11757","ko":"인도 음식점에서 난을 먹어요.","en":"I eat naan at an Indian restaurant.","speech_level":"해요","cloze":"인도","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11758","ko":"인도는 사람이 아주 많아요.","en":"India has a huge number of people.","speech_level":"해요","cloze":"인도","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11759","ko":"인도에서는 영어도 많이 써요.","en":"People also use English a lot in India.","speech_level":"해요","cloze":"인도","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"인도","roman":"indo","explain":"“인도”는 길 옆의 사람이 걷는 길도 뜻해요. 소리는 같아요. 어느 뜻인지는 앞뒤 말을 보고 알아요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"“인도” also means a sidewalk, the path where people walk beside a road. The two words sound the same. You can tell which one it is from the words around it.","contract_en":""},{"id":"n04138","kind":"word","ko":"필리핀","yo":"","en":"the Philippines","pos":"명사","usage":"","contract":"","examples":[{"id":"e08254","ko":"저는 필리핀 사람이에요.","en":"I'm Filipino.","speech_level":"해요","cloze":"필리핀","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08255","ko":"필리핀에 가고 싶어요.","en":"I want to go to the Philippines.","speech_level":"해요","cloze":"필리핀","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11760","ko":"필리핀 바다는 정말 예뻐요.","en":"The sea in the Philippines is really beautiful.","speech_level":"해요","cloze":"필리핀","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11761","ko":"필리핀 친구가 영어를 잘해요.","en":"My Filipino friend speaks English well.","speech_level":"해요","cloze":"필리핀","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11762","ko":"필리핀 망고는 아주 달아요.","en":"Philippine mangoes are very sweet.","speech_level":"해요","cloze":"필리핀","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"필리핀","roman":"pillipin","explain":"한국어에는 영어의 F 소리가 없어요. 그래서 F를 “ㅍ”으로 써요. 필리핀의 “필”은 Phil이에요. 프랑스의 “프”도 그래요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"Korean has no English F sound, so F is written with “ㅍ”. The “필” in 필리핀 is Phil. The “프” in 프랑스 (France) works the same way.","contract_en":""},{"id":"n04139","kind":"word","ko":"튀르키예","yo":"","en":"Türkiye (Turkey)","pos":"명사","usage":"","contract":"","examples":[{"id":"e08256","ko":"저는 튀르키예 사람이에요.","en":"I'm Turkish.","speech_level":"해요","cloze":"튀르키예","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08257","ko":"튀르키예에 가고 싶어요.","en":"I want to go to Türkiye (Turkey).","speech_level":"해요","cloze":"튀르키예","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11763","ko":"튀르키예는 커피와 차가 유명해요.","en":"Türkiye is famous for coffee and tea.","speech_level":"해요","cloze":"튀르키예","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11764","ko":"튀르키예 친구는 한국을 좋아해요.","en":"My Turkish friend likes Korea.","speech_level":"해요","cloze":"튀르키예","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11765","ko":"내년에 튀르키예 여행을 갈 거예요.","en":"I'm going on a trip to Türkiye next year.","speech_level":"해요","cloze":"튀르키예","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"튀르키예","roman":"twireukiye","explain":"예전에는 “터키”라고 많이 썼어요. 지금은 나라 이름이 “튀르키예”예요. 하지만 사람들은 아직 “터키”라고도 말해요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"People used to write “터키” a e same. Many foreign country names are English sounds written in Hangul.","contract_en":""},{"id":"n04161","kind":"word","ko":"아일랜드","yo":"","en":"Ireland","pos":"명사","usage":"","contract":"","examples":[{"id":"e08300","ko":"저는 아일랜드 사람이에요.","en":"I'm Irish.","speech_level":"해요","cloze":"아일랜드","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08301","ko":"아일랜드에 가고 싶어요.","en":"I want to go to Ireland.","speech_level":"해요","cloze":"아일랜드","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11829","ko":"제 친구는 아일랜드에서 영어를 공부했어요.","en":"My friend studied English in Ireland.","speech_level":"해요","cloze":"아일랜드","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11830","ko":"아일랜드는 날씨가 어때요? — 비가 자주 와요.","en":"How's the weather in Ireland? — It rains often.","speech_level":"해요","cloze":"아일랜드","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11831","ko":"다음 달에 아일랜드에서 친구하고 만날 거예요.","en":"Next month I'm going to meet a friend in Ireland.","speech_level":"해요","cloze":"아일랜드","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"아일랜드","roman":"aillaendeu","explain":"아일랜드(Ireland)와 아이슬란드(Iceland)는 다른 나라예요. 이름이 비슷해서 많이 헷갈려요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"아일랜드 (Ireland) and 아이슬란드 (Iceland) are different countries. The names are similar, so people often mix them up.","contract_en":""},{"id":"n04162","kind":"word","ko":"포르투갈","yo":"","en":"Portugal","pos":"명사","usage":"","contract":"","examples":[{"id":"e08302","ko":"저는 포르투갈 사람이에요.","en":"I'm Portuguese.","speech_level":"해요","cloze":"포르투갈","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08303","ko":"포르투갈에 가고 싶어요.","en":"I want to go to Portugal.","speech_level":"해요","cloze":"포르투갈","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11832","ko":"여름에 포르투갈 바다에서 수영할 거예요.","en":"This summer I'm going to swim in the sea in Portugal.","speech_level":"해요","cloze":"포르투갈","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11833","ko":"포르투갈 사람하고 영어로 이야기했어요.","en":"I talked with a Portuguese person in English.","speech_level":"해요","cloze":"포르투갈","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11834","ko":"이번 주말에 포르투갈 식당에서 만날까요?","en":"Shall we meet at a Portuguese restaurant this weekend?","speech_level":"해요","cloze":"포르투갈","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"포르투갈","roman":"poreutugal","explain":"포르투갈 말은 ‘포르투갈어’예요. 브라질에서도 포르투갈어를 써요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"The language of Portugal is ‘포르투갈어’ (Portuguese). People in Brazil speak 포르투갈어 too.","contract_en":""},{"id":"n04163","kind":"word","ko":"그리스","yo":"","en":"Greece","pos":"명사","usage":"","contract":"","examples":[{"id":"e08304","ko":"저는 그리스 사람이에요.","en":"I'm Greek.","speech_level":"해요","cloze":"그리스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08305","ko":"그리스에 가고 싶어요.","en":"I want to go to Greece.","speech_level":"해요","cloze":"그리스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11835","ko":"그리스 요리 식당에서 샐러드를 주문했어요.","en":"I ordered a salad at a Greek restaurant.","speech_level":"해요","cloze":"그리스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11836","ko":"그리스 친구하고 같이 한국어를 공부해요.","en":"I study Korean together with a Greek friend.","speech_level":"해요","cloze":"그리스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11837","ko":"그리스는 여름에 아주 더워요.","en":"Greece is very hot in summer.","speech_level":"해요","cloze":"그리스","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"그리스","roman":"geuriseu","explain":"나라 이름 뒤에 ‘어’를 붙이면 그 나라 말이 될 때가 많아요. 그리스어는 Greek이에요. 일본어, 중국어도 같아요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"Adding ‘어’ after a country name often gives you that country's language. 그리스어 is Greek. 일본어 (Japanese) and 중국어 (Chinese) work the same way.","contract_en":""},{"id":"n04164","kind":"word","ko":"스위스","yo":"","en":"Switzerland","pos":"명사","usage":"","contract":"","examples":[{"id":"e08306","ko":"저는 스위스 사람이에요.","en":"I'm Swiss.","speech_level":"해요","cloze":"스위스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08307","ko":"스위스에 가고 싶어요.","en":"I want to go to Switzerland.","speech_level":"해요","cloze":"스위스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11838","ko":"스위스에서 산을 보고 사진을 많이 찍었어요.","en":"In Switzerland I looked at the mountains and took lots of photos.","speech_level":"해요","cloze":"스위스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11839","ko":"스위스에서 기차를 타고 호수에 갔어요.","en":"In Switzerland I took a train to a lake.","speech_level":"해요","cloze":"스위스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11840","ko":"스위스 호텔에서 친구하고 이틀 쉬었어요.","en":"I rested for two days with a friend at a hotel in Switzerland.","speech_level":"해요","cloze":"스위스","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"스위스","roman":"seuwiseu","explain":"스위스에는 ‘스위스어’가 없어요. 독일어, 프랑스어, 이탈리아어 같은 말을 써요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"There is no ‘스위스어’ (Swiss language). People in Switzerland speak languages like German, French, and Italian.","contract_en":""},{"id":"n04165","kind":"word","ko":"오스트리아","yo":"","en":"Austria","pos":"명사","usage":"","contract":"","examples":[{"id":"e08308","ko":"저는 오스트리아 사람이에요.","en":"I'm Austrian.","speech_level":"해요","cloze":"오스트리아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08309","ko":"오스트리아에 가고 싶어요.","en":"I want to go to Austria.","speech_level":"해요","cloze":"오스트리아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11841","ko":"오스트리아에서 음악회에 갔어요.","en":"I went to a concert in Austria.","speech_level":"해요","cloze":"오스트리아","extra_wor ":[]},"dict_examples":[],"explain_en":"핀란드 is pronounced [필란드], because ㄴ followed by ㄹ sounds like [ㄹㄹ]. 연락 [열락] follows the same rule.","contract_en":""},{"id":"n04167","kind":"word","ko":"노르웨이","yo":"","en":"Norway","pos":"명사","usage":"","contract":"","examples":[{"id":"e08312","ko":"저는 노르웨이 사람이에요.","en":"I'm Norwegian.","speech_level":"해요","cloze":"노르웨이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08313","ko":"노르웨이에 가고 싶어요.","en":"I want to go to Norway.","speech_level":"해요","cloze":"노르웨이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11847","ko":"노르웨이는 겨울에 밤이 길어요.","en":"In Norway the nights are long in winter.","speech_level":"해요","cloze":"노르웨이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11848","ko":"노르웨이 친구가 김치를 좋아해요.","en":"My Norwegian friend likes kimchi.","speech_level":"해요","cloze":"노르웨이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11849","ko":"노르웨이에서 뭘 할까요? — 배를 탈까요?","en":"What shall we do in Norway? — Shall we take a boat?","speech_level":"해요","cloze":"노르웨이","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"노르웨이","roman":"noreuwei","explain":"‘산’은 ‘그 나라에서 나온 것’이라는 뜻이에요. 마트에서 ‘노르웨이산 연어’를 자주 볼 수 있어요.","video_url":"","video_title":"","phrases":[],"pron_source":"auto","pron_why":null,"dict_examples":[],"explain_en":"‘산’ means ‘something that comes from that country’. At the supermarket, you'll often see ‘노르웨이산 연어’ (salmon from Norway).","contract_en":""},{"id":"n04168","kind":"word","ko":"덴마크","yo":"","en":"Denmark","pos":"명사","usage":"","contract":"","examples":[{"id":"e08314","ko":"저는 덴마크 사람이에요.","en":"I'm Danish.","speech_level":"해요","cloze":"덴마크","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08315","ko":"덴마크에 가고 싶어요.","en":"I want to go to Denmark.","speech_level":"해요","cloze":"덴마크","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11850","ko":"덴마크 친구가 서울에서 한국어를 공부해요.","en":"My Danish friend studies Korean in Seoul.","sp
