const EX={DAYS:7,NEWN:100,MIN:10,SIZE:36,FAKES:4,PHR:3,PASS:.7,CUTDAYS:14,SUSP:.5,CUT:.5};
const DAY=864e5;
const exNew=now=>({start:now||0,at:0,base:0,skipUntil:0,seen:{},born:{},front:[],cut:0,cutUntil:0,hist:[]});
function exDue(E,learned,now){
  if(learned<EX.MIN||!E.start)return false;
  if(E.skipUntil&&now<E.skipUntil)return false;
  return now-(E.at||E.start)>=EX.DAYS*DAY||learned-(E.base||0)>=EX.NEWN}
function exWeight(E,id,stage,now){const t0=E.seen[id]||E.born[id]||E.start||now;const w=1+Math.min(4,Math.max(0,now-t0)/DAY/7);return stage===1?w*1.5:w}
function exShuffle(a,rng){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function exSample(list,wf,k,rng){return list.map(x=>({x,k:Math.pow(Math.max(rng(),1e-9),1/wf(x))})).sort((a,b)=>b.k-a.k).slice(0,k).map(o=>o.x)}
function exDistract(notes,pool,id,field,rng,n){const me=notes[id],seen=new Set([me[field]]),out=[];
  for(let t=0;t<80&&out.length<n;t++){const i=pool[Math.floor(rng()*pool.length)],v=notes[i]&&notes[i][field];
    if(i===id||!v||seen.has(v)||String(v).length>60)continue;if(me.pos&&notes[i].pos!==me.pos&&t<30)continue;seen.add(v);out.push(v)}
  return out}
function exFake(kos,rng){const set=new Set(kos),cand=kos.filter(k=>/^[가-힣]{2,3}$/.test(k));if(!cand.length)return null;const syl=Array.from(new Set(cand.join("")));
  for(let t=0;t<300;t++){const w=Array.from(cand[Math.floor(rng()*cand.length)]),p=Math.floor(rng()*w.length);w[p]=syl[Math.floor(rng()*syl.length)];const f=w.join("");if(!set.has(f))return f}return null}
/* c = {E, notes, pool(단어 id 전체), learned(배운 id), stage(id→단계), phr(문형 카드), now, rng, hasSnd(id)} */
function exBuild(c){const rng=c.rng,E=c.E,TY=["en","ko","type","listen"];
  const ids=exShuffle(exSample(c.learned,id=>exWeight(E,id,c.stage[id]||0,c.now),Math.min(EX.SIZE,c.learned.length),rng),rng),items=[];
  const mc=(id,field,ty)=>{const opts=exDistract(c.notes,c.pool,id,field,rng,3);opts.push(c.notes[id][field]);const o=exShuffle(opts,rng);return{k:"w",id,ty,choices:o,a:o.indexOf(c.notes[id][field])}};

  for(let i=0;i<EX.FAKES;i++){const f=exFake(kos,rng);if(f)items.push({k:"f",ko:f})}
  const ph=exShuffle(c.phr||[],rng).slice(0,EX.PHR);
  ph.forEach(p=>{const o=exShuffle((c.phr||[]).filter(x=>x!==p&&x.en!==p.en).slice(0,40),rng).slice(0,3).map(x=>x.en);o.push(p.en);const s=exShuffle(o,rng);items.push({k:"p",ph:p.phrase,choices:s,a:s.indexOf(p.en)})});

/* ans[i]: 고르기=고른 번호, 쓰기='ok'|'almost'|'bad', 가짜='real'|'notword' */
function exScore(items,ans){let nf=0,fy=0;const W=[],P=[];
  items.forEach((it,i)=>{const a=ans[i];
    if(it.k==="f"){nf++;if(a==="real")fy++}
    else if(it.k==="w")W.push({id:it.id,ty:it.ty,ok:it.ty==="type"?(a==="ok"||a==="almost"):a===it.a});

  const ty=W.filter(w=>w.ty==="type"),raw=W.length?W.filter(w=>w.ok).length/W.length:0;
  const acc=unrel?(ty.length?ty.filter(w=>w.ok).length/ty.length:raw*.5):raw;
  return{words:W,phr:{ok:P.filter(Boolean).length,n:P.length},fake:{n:nf,yes:fy},unrel,acc,raw}}
function exApply(E,res,learnedCount,now){E.at=now;E.base=learnedCount;E.skipUntil=0;
  res.words.forEach(w=>{E.seen[w.id]=now});
  const fg=res.words.filter(w=>w.res==="forgot").map(w=>w.id);
  E.front=Array.from(new Set(fg.concat(E.front||[])));
  E.cut=res.acc<EX.PASS?1:0;E.cutUntil=E.cut?now+EX.CUTDAYS*DAY:0;
  E.hist.push({at:now,n:res.words.length,acc:Math.round(res.acc*100)/100,forgot:fg.length,unrel:res.unrel});E.hist=E.hist.slice(-20);return fg}

/* T093: 새 단어 '보여 주기'(meet)를 먼저 전부, 사이 화면(sep) 한 장, 그다음 '확인'(복습+새 단어 rec)을 섞는다. 보여 주기에는 점수·SRS 없음 */

V.about=(p)=>{const i=p.step||0,[key,qk,qe,fk,fe]=ABOUT[i],q=(p.q||"").trim().toLowerCase();
  const row=(v,ko,en,icon="")=>`<button data-a="mePick" data-k="${key}" data-v="${v}" aria-pressed="${S.me[key]===v}"><span class="grow">${icon?icon+" ":""}<b>${esc(ko)}</b> <span class="s muted">${esc(en)}</span></span>${S.me[key]===v?"✓":""}</button>`;
  const items=key==="who"?FR.who.map(w=>row(w.key,w.label_ko,w.label_en,WHO_ICON[w.key]||"")):(key==="country"?FR.countries:FR.jobs).map(id=>NOTES[id]).filter(n=>!q||n.ko.includes(q)||n.en.toLowerCase().includes(q)).map(n=>row(n.id,n.ko,n.en.replace(/\s*\(.*\)$/,"")));
  return{top:`<span class="xs muted">${i+1}/3</span><span style="flex:1"></span><button class="link" data-a="meSkip">${t(2,"나중에","Later")}</button>`,
  html:`<div class="hero center" style="font-size:var(--fs-xl)">${t(2,qk,qe)}</div><p class="center xs muted" style="margin:-4px 0 4px">${t(3,"고른 단어가 첫 세트에 들어가요","Your picks go into your first set")}</p>${fk?`<input type="search" id="mq" placeholder="${t(2,fk,fe)}" aria-label="${fe}" value="${esc(p.q||"")}">`:""}<div class="rows">${items.join("")||`<p class="center muted">${t(2,"없어요","Not found")}</p>`}</div>`,
  after:()=>{const el=$("#mq");if(el)el.addEventListener("input",()=>{S.params.q=el.value;const pos=el.selectionStart;render();const j=$("#mq");j.focus();j.setSelectionRange(pos,pos)})}}};
function meNext(){const i=S.params.step||0,from=S.params.from;if(i<2)go("about",{step:i+1,from},false);else{meIds().forEach(id=>{if(S.stage[id]===undefined){S.stage[id]=0;S.pass[id]=0}});log("meDone:"+JSON.stringify(S.me));if(from)back();else go("diag",{i:0},false)}}

/* 2 진단: 한 단어씩 */
V.diag=(p)=>{const pool=[...SETS[3].word_ids,...SETS[4].word_ids].slice(0,12);const i=p.i||0;const id=pool[i];
  return{top:`<div class="prog"><i style="width:${Math.round(100*i/pool.length)}%"></i></div><span class="xs muted">${i+1}/${pool.length}</span><button class="link" data-a="diagSkip">${t(2,"나중에 하기","Later")}</button>`,
  html:`<p class="center muted" style="margin:24px 0 0">${t(2,"아는 단어예요?","Do you know this word?")}</p><div class="fill"></div><div class="word">${esc(NOTES[id].ko)}</div><div class="fill"></div>`,
  foot:`<div class="pair"><button class="btn" data-a="dk" data-v="0">${t(1,"몰라요","No")}</button><button class="btn" data-a="dk" data-v="1">${t(1,"알아요","Yes")}</button></div>`}};

/* 알림 안내 */
V.notice=()=>({html:`<div class="fill"></div><div class="hero center">${t(3,"아침마다 단어 하나<br>보내 드릴까요?","One word<br>every morning?")}</div><div class="fill"></div>`,
  foot:`<button class="btn pri" data-a="notiYes">${t(1,"좋아요","Yes, please")}</button><button class="link" data-a="notiNo">${t(1,"나중에","Later")}</button>`});

/* 3 홈: time first, count as detail — a short promise is less scary than a number of words */
V.home=()=>{const p=plan(),d=p.due.length,n=p.fresh.length,s=curSet();const fresh=n&&s===SETS[3]&&!S.newSetSeen;
  if(S.todayDone)return{top:homeTop(),
    html:`<div class="fill"></div><div class="hero center">${t(2,"오늘은 끝!","All done today")}</div><p class="center muted" style="margin:0">${S.lastCount?t(2,`단어 ${S.lastCount}개 공부했어요 · `,`${S.lastCount} words today · `):""}${t(2,"내일 또 만나요","See you tomorrow")}</p>${homeStreak()}${homeRb()}<div class="fill"></div>`,
    foot:`<button class="link" data-a="startToday">${t(2,"조금 더 하기","Do a little more")}</button>${examLink()}${rndLink()}${pcLink()}${hgLink()}`};
  /* v2 T063 (U12): nothing due and nothing new → say so instead of "0분 · 단어 0개" */
  if(!d&&!n)return{top:homeTop(),
    html:`<div class="fill"></div><div class="hero center">${t(2,"오늘 복습할 단어가 없어요","Nothing to review today")}</div><p class="center muted" style="margin:0">${t(3,"단어장에서 새 세트를 골라 보세요","Pick a new set in your word list")}</p><div class="fill"></div>`,
    foot:`<button class="btn" data-a="nav" data-to="vocab">${t(1,"단어장","Word list")}</button>${examLink()}${pcLink()}`};
  return{top:homeTop(),
  html:`<div class="fill" style="flex:2"></div><p class="center" style="margin:0;font-size:var(--fs-l);font-weight:700;color:var(--accent)">${t(2,"오늘 공부","Today")}</p><div class="hero center" style="font-size:96px;line-height:1;letter-spacing:-.02em;margin:-2px 0 6px">${minutes(d,n)}${t(1,"분"," min")}</div>
   <p class="center" style="margin:0;font-size:19px;font-weight:500">${t(2,`단어 ${d+n}개`,`${d+n} words`)}${fresh?` · ${t(2,"새 세트","new set")} '${esc(s.name_ko)}'`:n?t(2,` · 새 단어 ${n}개 포함`,` · ${n} new`):""}</p>
   <p class="center xs muted" style="margin:-6px 0 0">${t(3,"하나만 해도 오늘 출석이에요","Even one word counts for today")}</p>${homeStreak()}${homeRb()}<div class="fill" style="flex:3"></div>`,
  foot:`<button class="btn pri" data-a="startToday">${t(1,"시작","Start")}</button>${examLink()}${rndLink()}${pcLink()}${hgLink()}`}};

/* 4 질문 */
const starBtn=id=>`<button class="icon star" data-a="star" data-id="${id}" aria-pressed="${!!S.starred[id]}" aria-label="${S.starred[id]?"별표 빼기":"별표하기 (나중에 모아서 복습)"}">${S.starred[id]?"★":"☆"}</button>`;
function sessionTop(){const s=S.session;const pct=Math.round(100*s.i/s.queue.length);
  return`<button class="icon" data-a="stop" aria-label="그만하기">✕</button><div class="prog" aria-label="진행 ${pct}%"><i style="width:${pct}%"></i></div>${langQuick()}${s.undo?`<button class="icon" data-a="undo" aria-label="직전 카드 되돌리기">↶</button>`:`<span style="width:48px"></span>`}`}
/* T093 확인 카드 단서: 할 일 한 줄은 카드 위 라벨, 답 형식+예 1개(정답과 겹치지 않는 다른 낱말, 정답 힌트 없음) */
const EGW=[["책","book"],["물","water"],["집","house"]],EGC=[["저는 ___ 읽어요","책을"],["저는 ___ 마셔요","물을"]];
const egWord=n=>{const x=EGW.find(([k,e])=>!n.ko.includes(k)&&!n.en.toLowerCase().includes(e));return x?`${x[1]} → ${x[0]}`:""};
const egCloze=(e)=>{const x=EGC.find(([f,a])=>!e.ko.includes(a)&&!e.ko.includes(f.split(" ")[2])&&!(e.cloze||"").includes(a[0]));return x?`${x[0]} → ${x[1]}`:""};
const chkTag=()=>`<p class="center xs muted" style="margin:8px 0 0"><span class="tag chk">${t(1,"확인","Check")}</span></p>`;
const fmtLine=(f,eg)=>`<p class="center xs muted" style="margin:0">${f}${eg?` · ${t(1,"예","e.g.")} ${esc(eg)}`:""}</p>`;
V.sep=()=>({top:sessionTop(),
  html:`<div class="fill"></div><div class="hero center" style="font-size:var(--fs-xl)">${t(2,"이제 확인해 볼게요","Now let's check")}</div><p class="center muted" style="margin:0">${t(3,"방금 본 단어와 전에 배운 단어를 기억하는지 봐요","Do you remember these words?")}</p><div class="fill"></div>`,
  foot:`<button class="btn pri" data-a="sepNext">${t(1,"확인 시작","Start check")}</button>`});
V.q=()=>{const s=S.session,c=cur(),n=NOTES[c.id];
  if(c.dir==="sep")return V.sep();
  if(c.dir==="meet")return{top:sessionTop(),
    html:`<p class="center xs muted" style="margin:8px 0 0"><span class="tag meet">${t(2,"새 단어 — 읽고 들어 보세요","New word — just read and listen")}</span></p><div class="fill"></div>${wordHead(n)}${exBox(ex(n))}<p class="center xs muted" style="margin:0">${t(3,"소리 내어 한 번 따라 해 보세요","Say it out loud once")}</p><div class="fill"></div>`,
    foot:`<button class="btn pri" data-a="meetNext">${t(1,"다음","Next")}</button>`};
  if(c.dir==="rec")return{top:sessionTop(),html:`${chkTag()}<p class="center muted" style="margin:0;font-weight:700">${t(2,"뜻이 뭐예요?","What does it mean?")}</p>${fmtLine(t(2,"속으로 뜻을 떠올린 뒤 눌러요","Think of the meaning, then tap"),egWord(n))}<div class="fill"></div><div class="word">${esc(n.ko)}</div>${sound(n)}<div class="fill"></div>`,
    foot:`<button class="btn pri" data-a="reveal">${t(1,"뜻 보기","Show meaning")}</button>`};
  const isCloze=c.dir==="cloze",e=ex(n,1);
  const lv=isCloze?e.speech_level:(["동사","형용사"].includes(n.pos)?"해요":"");
  const q=isCloze?(()=>{const p=e.ko.split(e.cloze);return`${chkTag()}<p class="center" style="margin:0;font-weight:700">${t(2,"빈칸에 들어갈 말은?","Fill in the blank")}</p>${fmtLine(t(2,"빈칸에 들어갈 말만 한국어로","Korean, only the missing part"),egCloze(e))}<div style="font-size:var(--fs-l);text-align:center">${esc(p[0])}<span class="blank"></span>${esc(p[1]||"")}</div><p class="center s muted" style="margin:0">${esc(n.en)}</p>`})()
    :`${chkTag()}<p class="center" style="margin:0;font-weight:700">${t(2,"한국어로 뭐예요?","Say it in Korean")}</p>${fmtLine(t(2,"한국어로 한 낱말/표현","Korean, one word or phrase"),egWord(n))}<div class="mean" style="font-size:var(--fs-xl);font-weight:700">${esc(n.en)}</div>${peLine(n,1)}${disTag(n)}`;
  return{top:sessionTop(),
   html:`<div class="fill"></div>${q}${lv&&lv!=="중립"?`<div class="center"><span class="tag">${t(1,"말투","Style")}: ${esc(lv)}</span></div>`:""}
    ${shapeLine(isCloze?e.cloze:ans(n))}<input type="text" id="inp" autocomplete="off" lang="ko" aria-label="한국어로 쓰기" placeholder="${t(2,"한국어로 쓰기","Type in Korean")}" value="${esc(s.input)}">
    <div class="center">${s.hint?`<span class="s muted">${hintText(isCloze?e.cloze:ans(n))}</span>`:`<button class="link" data-a="hint">${t(1,"힌트","Hint")}</button>`}</div><div class="fill"></div>`,
   foot:`<div class="pair"><button class="btn" data-a="dunno">${t(1,"모르겠어요","I don't know")}</button><button class="btn pri" data-a="check">${t(1,"확인","Check")}</button></div>`,
   after:()=>{const i=$("#inp");i.focus();i.addEventListener("input",()=>s.input=i.value);i.addEventListener("keydown",ev=>{if(ev.key==="Enter")act("check")})}}};

/* ---------- T095 표현 탭: 문형·표현·관용어 카드 (단어와 따로 복습) ----------
   카드 = 커리큘럼 T095 문형 카드. 앞면 따라 할 문장(hl 굵게)+🔈 → 탭하면 설명·틀·뉘앙스·예문 4개↑ → 확인 = 빈칸(□ 모양·힌트는 T094 그대로) */
const PC_ON=!!((DATA.pcLv&&DATA.pcLv.length)||(DATA.pc&&DATA.pc.length));
const PCX={cards:[],by:{},started:false,done:false};
const PCI=[0,1,3,7],PC_LV=["","입문","초급","중급 1","중급 2","고급","전문"],PC_LVE=["","Beginner","Elementary","Intermediate 1","Intermediate 2","Advanced","Expert"];
const pcMaxLv=()=>STU?Math.max(1,...SETS.map(s=>s.lv||0)):9;
const pcMaxCh=()=>STU&&STU_CH&&STU_CH.size?Math.max(...STU_CH):999;
const pcOpen=c=>!STU||(!c.uv&&c.lv<=pcMaxLv()&&(!c.i||c.sf<=pcMaxLv())&&(c.u>300||c.u<=pcMaxCh()));
const pcAdd=a=>a.forEach(c=>{if(!PCX.by[c.id]){PCX.by[c.id]=c;PCX.cards.push(c)}});
function pcInherit(){const m=DATA.pcMap||{};Object.keys(m).forEach(nid=>{const st=S.stage[nid]||0;if(st<1)return;m[nid].forEach(cid=>{if(PCX.by[cid]&&!S.pcs[cid])S.pcs[cid]={s:Math.min(st,3),p:S.pass[nid]||0,d:0,b:Date.now(),from:nid}})})}
async function pcEnsure(){if(PCX.started)return;PCX.started=true;
  if(DATA.pc&&DATA.pc.length)pcAdd(DATA.pc);
  else{const C=DATA.chunks,mx=pcMaxLv();for(const lv of DATA.pcLv||[]){if(lv>mx)continue;
    for(let k=0;k<3;k++){try{const r=await fetch(CU(C,"_pc"+lv+".json"));if(!r.ok)throw 0;pcAdd(await r.json());break}catch(e){await new Promise(r=>setTimeout(r,500))}}}}
  pcInherit();PCX.done=true;if(!S.pcq&&S.screen==="pc")render()}
const ymd0=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const pcOpenCards=()=>PCX.cards.filter(pcOpen);
const pcDueList=()=>{const now=Date.now();return pcOpenCards().filter(c=>S.pcs[c.id]&&S.pcs[c.id].d<=now).sort((a,b)=>S.pcs[a.id].d-S.pcs[b.id].d)};
const pcToday=()=>{const k=ymd();return pcOpenCards().filter(c=>S.pcs[c.id]&&S.pcs[c.id].from===undefined&&ymd0(S.pcs[c.id].b)===k).length};
const pcNewPer=()=>S.settings.pcNew||3;
const pcNewList=()=>pcOpenCards().filter(c=>!S.pcs[c.id]).slice(0,Math.max(0,pcNewPer()-pcToday()));
const pcHl=(ko,hl)=>{if(!hl)return esc(ko);let out="",pos=0;for(const part of hl.split(" … ")){if(!part)continue;const i=ko.indexOf(part,pos);if(i<0)continue;out+=esc(ko.slice(pos,i))+"<b>"+esc(part)+"</b>";pos=i+part.length}return out+esc(ko.slice(pos))};
const pcSound=c=>`<button class="icon" data-a="sound" data-p="${c.id}" aria-label="듣기" style="margin:0 auto">🔈</button>`;
const pcFront=c=>`<div class="pcf">${pcHl(c.fk,c.fh)}</div><div class="mean s muted" style="font-size:var(--fs-m)">${esc(c.fe)}</div>${pcSound(c)}`;
const pcTitle=c=>c.p+(c.use?` · ${c.use}`:"");
function pcBack(c){return`<div class="card s"><b>${esc(pcTitle(c))}</b>${c.f&&c.f!==c.p?`<span class="muted xs">${esc(c.f)}</span>`:""}<span>${esc(t(3,c.xk,c.xe))}</span></div>
  <div class="card s"><b>${t(2,"뉘앙스·상황","Nuance & situation")}</b><span>${esc(t(3,c.nk,c.ne))}</span>${c.sim&&c.sim.length?`<span class="muted xs">${t(2,"비슷한 말","Similar")}: ${esc(c.sim.join(" · "))}</span>`:""}</div>
  <div class="card s"><b>${t(2,"예문","Examples")}</b>${c.ex.map(e=>`<div class="ex">${pcHl(e[0],e[2])}<div class="s muted">${esc(e[1])}</div></div>`).join("")}</div>`}
const pcStageName=id=>{const s=S.pcs[id];if(!s)return t(2,"새 표현","New");return t(2,["","씨앗","새싹","나무"][s.s],["","Seed","Sprout","Tree"][s.s])};
const pcTop=()=>{const q=S.pcq,p=Math.round(100*q.i/q.queue.length);return`<button class="icon" data-a="pcStop" aria-label="그만하기">✕</button><div class="prog" aria-label="진행 ${p}%"><i style="width:${p}%"></i></div>${langQuick()}<span style="width:48px"></span>`};
function pcStart(){if(!PCX.done)return;const due=pcDueList().slice(0,8),fresh=pcNewList();if(!due.length&&!fresh.length){toast(t(2,"오늘 할 표현이 없어요","No expressions left for today"));return}
  const chk=shuffle([...due.map(c=>({id:c.id,ph:"chk",z:(S.pcs[c.id].p||0)%2})),...fresh.map(c=>({id:c.id,ph:"chk",z:0}))]);
  const q=[...fresh.map(c=>({id:c.id,ph:"meet"})),...(fresh.length?[{sep:1}]:[]),...chk];
  S.pcq={queue:q,i:0,res:[],input:"",hint:false,graded:null,flip:false,peek:false,ret:{screen:S.screen,params:S.params,history:[...S.history]}};go("pcq",{},false)}
const pcCur=()=>S.pcq&&S.pcq.queue[S.pcq.i];
function pcSubmit(r){const q=S.pcq,c=pcCur(),now=Date.now();let st=S.pcs[c.id];if(!st)st=S.pcs[c.id]={s:1,p:0,d:now+DAY,b:now};
  if(r==="meet"){markStudy();return}
  q.res.push({id:c.id,r});evPush("pc:"+c.id,r,"pc");markStudy();
  if(r==="bad"){st.s=1;st.p=0;st.d=now+DAY;q.queue.push({id:c.id,ph:"chk",z:(c.z+1)%2,retry:1})}
  else{st.p=(st.p||0)+1;if(r!=="hard")st.s=Math.min(3,st.s+1);st.d=now+PCI[st.s]*DAY}}
function pcNext(){const q=S.pcq;q.i++;q.input="";q.hint=false;q.graded=null;q.flip=false;q.peek=false;
  if(q.i>=q.queue.length){const n=new Set(q.res.map(x=>x.id)).size;S.pcq=null;S.history=q.ret.history;go("pc",{},false);toast(t(2,`끝! 표현 ${n}개 했어요`,`Done! ${n} expressions`));return}
  go("pcq",{},false)}
function pcAct(a,d){const q=S.pcq;switch(a){
  case"pcStart":pcStart();return true;
  case"pcCard":go("pcd",{id:d.id},true);return true;
  case"pcFlip":q.flip=true;render();return true;
  case"pcPeek":q.peek=!q.peek;render();return true;
  case"pcMeetNext":pcSubmit("meet");pcNext();return true;
  case"pcSepNext":pcNext();return true;
  case"pcHint":q.hint=true;render();return true;
  case"pcDunno":q.input="";q.graded={r:"bad",dunno:true};pcSubmit("bad");render();return true;
  case"pcCheck":{const c=pcCur(),z=PCX.by[c.id].cz[c.z];q.input=($("#inp")||{}).value||"";if(!q.input.trim()){toast(t(3,"답을 써 주세요. 모르면 '모르겠어요'","Type an answer, or tap 'I don't know'"));return true}
    q.graded=grade(q.input,z[1]);pcSubmit(q.graded.r==="bad"?"bad":q.hint?"hard":q.graded.r);render();return true}
  case"pcNext":pcNext();return true;
  case"pcStop":{const r=q.ret;S.pcq=null;S.history=r.history;go("pc",{},false);return true}}
  return false}
V.pcd=(p)=>{const c=PCX.by[p.id];if(!c)return{top:`${backBtn}<h1>${t(2,"표현","Expressions")}</h1>`,html:""};
  return{top:`${backBtn}<h1>${esc(c.p)}</h1>${langQuick()}`,html:`${pcFront(c)}<p class="center xs muted" style="margin:0">${esc(pcStageName(c.id))} · ${esc(t(2,PC_LV[c.lv],PC_LVE[c.lv]))}</p>${pcBack(c)}`}};
V.pc=()=>{pcEnsure();const top=`${backBtn}<h1>${t(2,"표현","Expressions")}</h1>${langQuick()}`;
  if(!PCX.done)return{top,html:`<p class="muted center">${t(2,"불러오는 중…","Loading…")}</p>`};
  const open=pcOpenCards();if(!open.length)return{top,html:`<p class="muted center">${t(2,"아직 열린 표현이 없어요. 단원을 더 공부하면 열려요.","No expressions yet. They open as you study more units.")}</p>`};
  const due=pcDueList().length,nw=pcNewList().length,known=open.filter(c=>S.pcs[c.id]&&S.pcs[c.id].s>=2).length;
  const lvs=[...new Set(open.map(c=>c.lv))].sort(),first=lvs.find(l=>open.some(c=>c.lv===l&&!(S.pcs[c.id]&&S.pcs[c.id].s>=2)))||lvs[0];
  return{top,html:`<p class="muted s" style="margin:0 4px">${t(2,"문장 틀과 표현을 문장으로 익혀요.","Learn sentence patterns and set phrases in whole sentences.")}</p>

/* phrase = "표현 (meaning) :: 예문 :: 느낌" — example and nuance are optional */
const phrase=x=>{if(typeof x==="object"){const eq=x.en_equiv&&x.en_equiv!=="—"?x.en_equiv:"";
    return`<div class="ph"><b>${esc(x.ko)}</b>${x.example?`<span class="s">“${esc(x.example)}”</span>`:""}
      ${(()=>{const lt=(x.literal||"").trim(),tail=eq?`${t(2,"영어로는","In English")} <i>${esc(eq)}</i>`:esc(x.meaning_en||""),parts=[lt?`${t(2,"직역","Literally")} ${esc(lt)}`:"",tail].filter(Boolean);return parts.length?`<span class="xs muted">${parts.join(" · ")}</span>`:""})()}
      ${(()=>{const nu=t(3,x.nuance_ko,x.nuance_en||"");return nu?`<span class="xs muted">→ ${esc(nu)}</span>`:""})()}</div>`}
  const [head,exs,nu]=x.split(" :: ");const m=head.match(/^(.*?) \((.*)\)$/);
  return`<div class="ph"><b>${esc(m?m[1]:head)}</b>${m?`<span class="xs muted">${esc(m[2])}</span>`:""}${exs?`<span class="s">“${esc(exs)}”</span>`:""}${nu?`<span class="xs muted">→ ${esc(nu)}</span>`:""}</div>`};

  const w=()=>tr.children[0].offsetWidth+8;
  const upd=()=>{const k=Math.min(tr.children.length-1,Math.round(tr.scrollLeft/w()));const c=box.querySelector("[data-count]");if(c)c.textContent=`${k+1} / ${tr.children.length}`;

  tr.addEventListener("click",e=>{const sl=e.target.closest(".slide");if(!sl||sl.classList.contains("cur")||e.target.closest("button"))return;tr.scrollTo({left:[...tr.children].indexOf(sl)*w(),behavior:"smooth"})});

function hgMake(tab){const q=[],opts=(a,x)=>shuffle([...new Set([a,...x])]);

  const all=hgKind(tab);shuffle(all.slice()).slice(0,8).forEach(c=>{const g=(HG.groups.find(g=>g.includes(c.char))||[]).filter(x=>x!==c.char),same=all.filter(x=>hgCan(x.char)!==hgCan(c.char));

  return q}

/* 단어 넣기: 하나 / 목록·파일 / 선생님께 부탁
   T155c: 입력 → 중앙 DB에 같은 말·비슷한 말이 있으면 먼저 보여 주고, 고르면 그 카드를 넣는다. 없으면 카드로 바로 만들지 않고
   '검토 대기'로 서버(과제 서버 student.word_suggest)에 보낸다. 화면에는 '선생님 확인 중'. 선생님·커리큘럼 검토 뒤에 카드가 된다. */
let KIDX=null;
async function loadKidx(){if(KIDX)return KIDX;const C=DATA.chunks;
  if(C){try{KIDX=await (await fetch(CU(C,"_ko.json"))).json()}catch(e){KIDX=null}}
  if(!KIDX){KIDX={};Object.values(NOTES).forEach(n=>{if(n.kind==="word"&&n.ko&&!KIDX[n.ko])KIDX[n.ko]="|"+n.id})}
  return KIDX}
const kstem=x=>x.replace(/\s/g,"").replace(/(하다|되다|다)$/,"");
async function fetchNote(sid,nid){if(NOTES[nid])return NOTES[nid];const C=DATA.chunks;
  if(sid&&C){try{(await (await fetch(CU(C,sid+".json"))).json()).forEach(n=>{addN(n)})}catch(e){}}
  return NOTES[nid]||null}
/* 같은 말(0) · 어간이 같음(1: 가다/가요 꼴 변형, 하다·되다 붙임 여부, 띄어쓰기) · 앞부분이 같거나 포함(2) 순으로 최대 5개 */
async function similarDb(ko,en){const kx=await loadKidx(),q=ko.replace(/\s/g,""),qs=kstem(ko),sc=[];
  for(const k in kx){const nk=k.replace(/\s/g,""),ks=kstem(k);let r=9;
    if(nk===q)r=0;else if(ks&&ks===qs)r=1;
    else if(qs.length>=2&&ks.length>=2&&(ks.startsWith(qs)||qs.startsWith(ks)||(qs.length>=3&&ks.includes(qs))))r=2;
    if(r<9)sc.push([r,Math.abs(nk.length-q.length),k])}
  sc.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const out=[];
  for(const [r,,k] of sc.slice(0,5)){const [sid,nid]=kx[k].split("|"),n=await fetchNote(sid,nid);if(n&&n.kind==="word")out.push({ko:n.ko,en:n.en||"",nid,sid,r})}
  if(en){const e=en.toLowerCase();Object.values(NOTES).forEach(n=>{if(out.length<5&&n.kind==="word"&&(n.en||"").toLowerCase()===e&&!out.some(o=>o.nid===n.id))out.push({ko:n.ko,en:n.en,nid:n.id,sid:"",r:1.5})})}
  return out}
async function addDbWord(m){const n=await fetchNote(m.sid,m.nid);if(!n)return"fail";
  if(allWords().includes(m.nid))return"dup";
  S.mine.push(m.nid);if(S.stage[m.nid]===undefined){S.stage[m.nid]=0;S.pass[m.nid]=0}
  S.mineDb.push({ko:m.ko,nid:m.nid,sid:m.sid});return"ok"}
function suggestWord(ko,en,exko){S.pend.push({ko,en:en||"",ex:exko||"",at:Date.now(),st:"queued"});flushPend()}
async function flushPend(){const H=window.HWAPI;if(!H||!H.api||!H.m)return;
  for(const p of S.pend){if(p.st!=="queued")continue;
    try{const j=await (await fetch(H.api,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"student.word_suggest",m:H.m,ko:p.ko,en:p.en,ex:p.ex,at:p.at})})).json();if(j&&j.ok)p.st="sent"}catch(e){}}}
/* T113 진도 중앙 저장: 카드 결과를 기기 큐(localStorage kwd.evq.v1:<m>)에 쌓고 과제 서버 student.card_log 로 묶어 보낸다.
   이벤트 e = 기기번호+순번(서버가 중복 버림). 오프라인이면 큐에 남아 다음 연결 때 전송. 첫 연결 때 기기 진도 snap(카드별 단계·횟수·마지막 결과)을 한 번 올림. 화면 변화 없음 */
const EV={q:null,sent:false,busy:false,dev:null,seq:0,snapDone:false};
function evKey(){const H=window.HWAPI;return H&&H.m?"kwd.evq.v1:"+H.m:null}
function evLoad(){if(EV.q)return true;const k=evKey();if(!k)return false;
  try{const o=JSON.parse(localStorage.getItem(k)||"{}");EV.q=Array.isArray(o.q)?o.q:[];EV.dev=o.dev||("d"+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36));EV.seq=o.seq||0;EV.snapDone=!!o.snap}catch(e){EV.q=[];EV.dev="d"+Date.now().toString(36);EV.seq=0}
  return true}
function evSave(){const k=evKey();if(!k||!EV.q)return;try{localStorage.setItem(k,JSON.stringify({q:EV.q.slice(-2000),dev:EV.dev,seq:EV.seq,snap:EV.snapDone}))}catch(e){}}
const evCard=id=>{id=String(id);return/^m\d+$/.test(id)&&NOTES[id]?"m:"+NOTES[id].ko:id};
function evPush(id,r,dir){try{if(!evLoad())return;EV.seq++;EV.q.push({e:EV.dev+":"+EV.seq,c:evCard(id),r:r,d:dir||"",t:Date.now()});evSave();evFlush()}catch(e){}}
async function evFlush(){if(EV.busy||EV.off||!window.EVREADY)return;const H=window.HWAPI;if(!H||!H.api||!H.m||!evLoad())return;EV.busy=true;
  try{
    if(!EV.snapDone){const snap=[];Object.keys(S.stage).forEach(id=>{const st=S.stage[id]||0,p=S.pass[id]||0,l=S.last[id]||"";if(st||p||l)snap.push({c:evCard(id),s:st,p:p,l:l})});
      Object.keys(S.pcs||{}).forEach(id=>{const x=S.pcs[id];if(x)snap.push({c:"pc:"+id,s:x.s||0,p:x.p||0,l:""})});
      let ok=true;for(let i=0;i<snap.length||i===0;i+=400){const j=await (await fetch(H.api,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"student.card_log",m:H.m,dev:EV.dev,snap:snap.slice(i,i+400),snap_part:i/400,snap_last:i+400>=snap.length})})).json();if(!(j&&j.ok)){ok=false;EV.off=1;break}}
      if(ok){EV.snapDone=true;evSave()}else return}
    while(EV.q.length){const b=EV.q.slice(0,200);
      const j=await (await fetch(H.api,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"student.card_log",m:H.m,dev:EV.dev,ev:b})})).json();
      if(!(j&&j.ok)){EV.off=1;break}EV.q=EV.q.slice(b.length);EV.sent=true;evSave()}
  }catch(e){}finally{EV.busy=false}}
addEventListener("online",()=>{EV.off=0;evFlush()});setInterval(()=>{if(EV.q&&EV.q.length||EV.q===null)evFlush()},30000);
/* T112: 서버 student.words 의 suggest[](status·label_en/ko·card_ko/en·note)를 읽어 검토 결과를 보인다. 서버에 없는 기기 대기분은 '선생님 확인 중' */
const sugRows=()=>{const sv=(window.HWSUG||[]).map(x=>{const st=x.status||"pending",card=TIER[S.settings.lang]>=2?(x.card_ko||x.card_en):(x.card_en||x.card_ko);
    const lab=st==="rejected"?(x.note||(t(2,"넣지 않았어요","Not added"))):(st==="added"||st==="linked")?`${t(2,"카드가 됐어요","Added")}${card?` · ${card}`:""}`:(TIER[S.settings.lang]>=2?(x.label_ko||x.label_en):(x.label_en||x.label_ko))||t(2,"선생님 확인 중","Teacher is checking");
    return{ko:x.ko,en:x.en||"",lab}});
  const have=new Set(sv.map(r=>r.ko));
  return sv.concat(S.pend.filter(p=>!have.has(p.ko)).map(p=>({ko:p.ko,en:p.en,lab:t(2,"선생님 확인 중","Teacher is checking")})))};
const pendList=()=>{const R=sugRows();return R.length?`<div class="glist" data-pend>${R.map(p=>`<div class="grow-row"><span class="fill">${esc(p.ko)}${p.en?` <span class="muted">· ${esc(p.en)}</span>`:""}</span><span class="xs muted">${esc(p.lab)}</span></div>`).join("")}</div>`:""};
const simBlock=p=>p.sim?`<p class="s" style="margin:0"><b>${p.sim.length?t(2,"비슷한 단어가 이미 있어요. 이 카드를 넣을까요?","Similar words already exist. Add this card?"):""}</b></p>
  ${p.sim.length?`<div class="glist">${p.sim.map((m,i)=>`<button class="grow-row" data-a="addSim" data-i="${i}"><span class="fill"><b>${esc(m.ko)}</b> <span class="muted">${esc(m.en)}</span></span><span class="xs">${t(2,"넣기","Add")}</span></button>`).join("")}</div>`:""}

V.addOne=(p)=>({top:`${backBtn}<h1>${t(2,"단어 하나 넣기","Add a word")}</h1>`,
  html:`<label class="s" for="a1">${t(1,"단어","Word")}</label><input type="text" id="a1" lang="ko" value="${esc(p.ko||"")}" placeholder="예: 편의점">
   <label class="s" for="a2">${t(1,"뜻","Meaning")} <span class="muted">(${t(2,"비워도 돼요","optional")})</span></label><input type="text" id="a2" placeholder="convenience store">
   <label class="s" for="a3">${t(1,"예문","Example")} <span class="muted">(${t(2,"선택","optional")})</span></label><input type="text" id="a3" lang="ko" placeholder="편의점에서 물을 사요.">
   <p class="xs muted" style="margin:0">${t(3,"먼저 같은 단어가 있는지 찾아요. 없으면 선생님이 확인한 뒤에 카드가 돼요.","We look for the same word first. If there is none, it becomes a card after your teacher checks it.")}</p>${simBlock(p)}${pendList()}`,
  foot:`<button class="btn pri" data-a="addOneSave">${t(1,"넣기","Add")}</button>`});
function parseList(txt){const s=txt.trim();if(!s)return[];
  if(/^[\[{]/.test(s)){try{const j=JSON.parse(s);const arr=Array.isArray(j)?j:j.words||[];return arr.map(o=>({ko:(o.ko||o.korean||o.word||"").trim(),en:(o.en||o.meaning||o.english||"").trim()}))}catch{return[{ko:"",en:"",err:"JSON 형식이 맞지 않아요"}]}}
  return s.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(/\t|,|=| - /).map(x=>x.trim());const h=x=>/[가-힣]/.test(x||"");
    return !h(c[0])&&h(c[1])?{ko:c[1],en:c[0]}:{ko:c[0]||"",en:c[1]||""}})
    .filter(r=>!/^(ko|korean|단어|word)$/i.test(r.ko))}
const okRow=r=>/[가-힣]/.test(r.ko)&&!r.err;

     <div class="rows">${rows.slice(0,30).map(r=>`<div><span class="grow">${esc(r.ko)||"—"} <span class="muted">${esc(r.en)}</span></span><span class="xs ${okRow(r)?"muted":""}">${okRow(r)?"✓":r.err||t(2,"한국어 단어가 없어요","no Korean word")}</span></div>`).join("")}</div></div>`:""}

/* ---------- actions ---------- */
function act(a,el){const d=el?el.dataset:{};const s=S.session;log("tap:"+a);if(a.slice(0,4)==="exam"&&examAct(a,d))return;if(a.slice(0,2)==="pc"&&pcAct(a,d))return;
  switch(a){
  case"codeOk":{const v=$("#code").value.trim();if(!v){toast(t(2,"코드를 넣어 주세요","Please enter your code"));return}S.code=v;S.me={...ROSTER_ME};go("diag",{i:0},false);break}
  case"dk":{const i=(S.params.i||0)+1;if(i>=12){S.diagDone=true;go("notice",{},false)}else go("diag",{i},false);break}
  case"diagSkip":go("notice",{},false);break;
  case"mePick":S.me[d.k]=S.me[d.k]===d.v?"":d.v;meNext();break;
  case"meSkip":{if(S.params.from)back();else go("diag",{i:0},false);break}
  case"notiYes":case"notiNo":S.settings.notiOn=a==="notiYes";log("firstRunDone");home();break;
  case"menu":S.sheet="menu";render();break;
  case"addMenu":S.sheet="addMenu";render();break;
  case"noteMenu":S.sheet="noteMenu";render();break;
  case"litToggle":{S.settings.litOpen=S.settings.litOpen===false;const y=$("#screen").scrollTop;render();$("#screen").scrollTop=y;break}
  case"litSeg":{el.classList.toggle("on");break}
  case"exPrev":case"exNext":{const tr=el.closest("[data-exs]").querySelector(".track");tr.scrollBy({left:(a==="exNext"?1:-1)*(tr.children[0].offsetWidth+8),behavior:"smooth"});break}
  case"exAll":S.sheet="exAll";render();break;
  case"chip":{const f=S.vf;if(f.a===d.v){f.a=f.b;f.b="";}else if(f.b===d.v)f.b="";else if(!f.a)f.a=d.v;else f.b=d.v;render();break}
  case"v2tab":{const col=COLS.some(x=>x[0]===S.vf.a)?S.vf.a:S.vf.b;S.vf.a=d.v||(col||"");S.vf.b=d.v&&col?col:"";if(!d.v&&col){S.vf.a=col;S.vf.b=""}render();break}
  case"v2col":{const kn=KNOW.some(x=>x[0]===S.vf.a)?S.vf.a:"";const col=COLS.some(x=>x[0]===S.vf.a)?S.vf.a:S.vf.b;if(col){S.vf.a=kn;S.vf.b="";render()}else{S.sheet="v2col";render()}break}
  case"v2colSet":{const kn=KNOW.some(x=>x[0]===S.vf.a)?S.vf.a:"";if(kn){S.vf.b=d.v}else{S.vf.a=d.v;S.vf.b=""}S.sheet=null;render();break}
  case"v3open":S.vf.a=d.v;S.vf.b="";render();$("#screen").scrollTop=0;break;
  case"v3back":S.vf.a="";S.vf.b="";render();break;
  case"v4menu":S.sheet="v4menu";render();break;
  case"v4set":S.vf.a=d.v;S.vf.b="";S.sheet=null;render();break;
  case"spot":S.sceneOpen=S.sceneOpen===d.id?null:d.id;{const y=$("#screen").scrollTop;render();$("#screen").scrollTop=y}break;
  case"sceneQuizStart":{const sc=SCENES[d.set];const ids=sc.spots.map(x=>x.id).filter(id=>S.stage[id]>=1).sort(()=>Math.random()-.5);S.sceneQuiz={set:d.set,order:ids,i:0,picked:null,ok:null,show:null,wrong:[]};S.sceneOpen=null;go("sceneQuiz",{set:d.set});break}
  case"scenePick":{const q=S.sceneQuiz;if(q.picked)break;const want=q.order[q.i];q.picked=d.id;q.ok=d.id===want;q.show=want;if(!q.ok)q.wrong.push(want);log(`scene:${want}:${q.ok?"good":"again"}`);if(q.ok)markStudy();render();break}
  case"sceneNext":{const q=S.sceneQuiz;q.i++;q.picked=q.ok=q.show=null;if(q.i>=q.order.length&&q.wrong.length){q.order.push(...q.wrong);q.wrong=[]}
    if(q.i>=q.order.length){const set=q.set;S.sceneQuiz=null;back();toast(t(2,"그림 퀴즈 끝! 오늘 공부한 걸로 기록했어요","Picture quiz done · counted for today"))}else render();break}
  case"sceneQuit":S.sceneQuiz=null;back();break;
  case"chipClear":S.vf.a="";S.vf.b="";render();break;
  case"sortSheet":S.sheet="sort";render();break;

/* ---------- T109b 시작: 분할판이면 필요한 세트 단어를 받은 뒤 첫 화면. 통짜판은 바로 ---------- */
const AGAIN={};
const DEF=[];   // T140i/j: 나중에 채울 수업 단어 카드 {n,w,ko,ex}
let BGP=Promise.resolve();   // 후순위 채우기가 끝나면 풀리는 약속(go 가 임시 카드 화면을 잡아 둘 때 씀)
const DBN=32;   // T140j: 중앙 DB 색인 조각 수(scripts/split_proto.py 와 같은 해시)
const dbHash=k=>{let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return h%DBN};
const DBI={},DBP={},DBK=new Set();   // DBI: 받아 둔 DB 행(ko -> [영어 뜻, 품사, 예문 ko, 예문 en]), DBP: 조각별 받기 약속, DBK: DB 단어 목록
const loadDb=async kos=>{const C=DATA.chunks;if(!C)return;
  await Promise.all([...new Set(kos.filter(k=>k&&!k.startsWith("-")&&!(k in DBI)).map(dbHash))].map(h=>DBP[h]||(DBP[h]=(async()=>{
    for(let t=0;t<3;t++){try{Object.assign(DBI,await (await fetch(CU(C,"_db"+h+".json"))).json());return}catch(e){await new Promise(r=>setTimeout(r,400))}}})())))};
const bgFill=async()=>{
  if(!DEF.length||!DATA.chunks||!window.FILLER)return;const C=DATA.chunks,bySet={};
  const left=DEF.filter(d=>d.n.pending);
  left.forEach(d=>{const sid=FILLER.sidOf(d.ko);if(sid)(bySet[sid]=bySet[sid]||[]).push(d)});
  const q=Object.keys(bySet);
  await Promise.all([loadDb(left.map(d=>d.ko)),...Array.from({length:6},async()=>{while(q.length){const sid=q.shift();
    for(let t=0;t<3&&!bySet[sid].every(d=>NOTES[FILLER.nidOf(d.ko)]);t++){try{(await (await fetch(CU(C,sid+".json"))).json()).forEach(n=>{addN(n)})}catch(e){await new Promise(r=>setTimeout(r,500))}}}})]);
  for(const d of left){const f=await FILLER.full(d.w,d.ko,d.ex,d.n.id);if(!f)continue;
    Object.keys(d.n).forEach(k=>delete d.n[k]);Object.assign(d.n,f)}
  if(!S.session&&(S.screen==="home"||S.screen==="vocab"))render();
};
