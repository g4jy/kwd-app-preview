<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kwd 화면 흐름 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ===== THEME (Stage 1 grey box). Every color / font / size lives here; screens never hard-code them. =====
   Layout idea: one thing per screen. One big action at the bottom, small extras in corners. */
/* v2 (T062): brand light theme is the default (DESIGN.md tokens: --paper --card --ink --cobalt --line --mute --ok --stamp).
   Contrast of every text/background pair >= 4.5:1 — see results/T062_v2시안/대비표.md. Dark only when data-theme="dark" is set. */
:root{
  --bg:#E8ECF8; --phone:#F6F7FB; --surface:#FFFFFF; --box:#E8ECF8; --line:#DADFEC;
  --text:#0F1A3B; --muted:#5B6684; --accent:#2145C4; --on-accent:#FFFFFF;
  --stamp:#CF3B2C; --on-stamp:#FFFFFF;
  --ok:#1F7A4D; --ok-bg:#E6F4EC; --bad:#B3261E; --bad-bg:#FCEBE9; --warn:#8A5A00; --warn-bg:#FFF4DC;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fs-xs:15px; --fs-s:15px; --fs-m:17px; --fs-l:22px; --fs-xl:30px; --fs-word:46px;
  --r:16px; --tap:56px; --tap-min:48px;
  --t-fast:150ms; --t-mid:220ms; --t-slow:300ms; --ease-out:cubic-bezier(.23,1,.32,1); --ease-back:cubic-bezier(.34,1.56,.64,1);
}
:root[data-theme="dark"]{
  --bg:#14171a; --phone:#1b1f23; --surface:#23282d; --box:#2a3036; --line:#3a4148;
  --text:#e7eaed; --muted:#9ba4ac; --accent:#dfe3e7; --on-accent:#14171a;
  --ok:#80cb9d; --ok-bg:#1e3327; --bad:#e8958c; --bad-bg:#3b2422; --warn:#e3c56b; --warn-bg:#3a321a; color-scheme:dark}
/* ===== end THEME ===== */

html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-m);line-height:1.6;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:100%;max-width:420px;height:min(860px,calc(100dvh - 80px));background:var(--phone);border:1px solid var(--line);
  border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.bar-top{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px}
.bar-top h1{font-size:var(--fs-l);margin:0;flex:1}
.icon{width:48px;height:48px;border:none;background:none;border-radius:12px;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);display:grid;place-items:center}
.icon:hover{background:var(--box)}
.screen{flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px}
.screen>*{flex-shrink:0}
.screen>.fill{flex-shrink:1}
.fill{flex:1}
.center{text-align:center}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:stretch}
/* v2 T063 (U8): the button you see is 44px; an invisible ::after adds 4px above and below, so the tap area stays 52px (>=48) */
.btn{min-height:44px;position:relative;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:0 18px;cursor:pointer;font-weight:500}
.btn::after,.chip::after{content:"";position:absolute;inset:-4px 0}
.btn.pri{background:var(--stamp);color:var(--on-stamp);border-color:var(--stamp);font-weight:600;font-size:18px}
.btn.pri:disabled{opacity:.5;cursor:default}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.link{border:none;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:var(--tap-min);padding:0 8px;font-size:var(--fs-s)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--muted)} .s{font-size:var(--fs-s)} .xs{font-size:var(--fs-xs)}
.hero{font-size:var(--fs-xl);font-weight:700;line-height:1.3;text-wrap:balance}
.word{font-size:var(--fs-word);font-weight:700;line-height:1.2;word-break:keep-all;text-align:center}
.mean{font-size:var(--fs-l);text-align:center}
.prog{height:8px;background:var(--box);border-radius:99px;overflow:hidden;flex:1}
.prog>i{display:block;height:100%;background:var(--accent);transition:width var(--t-slow) var(--ease-out)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
/* '왜?' — why the sound differs from the spelling: jamo tiles, the moving/changing ones animate (teacher 2026-10-18); hidden until tapped */
.why-btn{min-height:var(--tap-min);min-width:var(--tap-min);padding:0 8px;font-size:var(--fs-xs)}
.why{margin:2px 0 8px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.why .stage{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative;min-height:40px}
.why .syl{display:inline-flex;gap:2px;padding:3px 4px;border-radius:8px;background:var(--box)}
.why .t{display:inline-grid;place-items:center;width:26px;height:34px;border-radius:6px;background:var(--surface);font-size:19px;font-weight:600;line-height:1;overflow:hidden;transition:transform .6s ease,opacity .4s,width .4s,background .3s,color .3s}
.why .t.will{outline:2px solid var(--warn);outline-offset:-2px} /* T063 U1: was an inset box-shadow */
.why .t.ghost{color:var(--muted);background:transparent;outline:1px solid var(--line);outline-offset:-1px}
.why .t.hot{background:var(--warn-bg);color:var(--warn);transform:scale(1.15)}
.why .t.new{background:var(--ok-bg);color:var(--ok)}
.why .t.gone{opacity:0;width:0}
.why .fly{position:absolute;z-index:2;pointer-events:none;background:var(--warn-bg);color:var(--warn)}
.why .res{font-weight:700;font-size:var(--fs-l);opacity:0;transition:opacity .4s}.why .res.on{opacity:1}
.why p{margin:0;align-self:stretch;text-align:left}
.sim.tmode{display:block;width:390px;max-width:100%;margin:8px auto 0;border:1px solid var(--line,#ddd);border-radius:12px;padding:8px 12px}.tmode summary{cursor:pointer;font-weight:600;text-align:center}.tmode .btn{min-height:var(--tap-min);padding:0 16px;font-size:var(--fs-s,14px)}.tmode label{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:4px 0}.tmode label.chk{justify-content:flex-start}.tmode select{max-width:220px}
@media (prefers-reduced-motion:reduce){.why .t,.why .res{transition:none}}
.ex b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--text);margin:0 2px}
.res{border-radius:var(--r);padding:12px 16px;font-weight:700;text-align:center}
.res.ok{background:var(--ok-bg);color:var(--ok)} .res.bad{background:var(--bad-bg);color:var(--bad)} .res.warn{background:var(--warn-bg);color:var(--warn)}
/* v2: result = color + text + icon (WCAG 1.4.1). Icon is decorative (text already says it). */
.res.ok::before,.res.bad::before,.res.warn::before{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:8px;border-radius:50%;color:#fff;font-size:17px;vertical-align:middle}
.res.ok::before{content:"✓"/"";background:var(--ok)} .res.bad::before{content:"✕"/"";background:var(--bad)} .res.warn::before{content:"△"/"";background:var(--warn)}
.res.ok,.res.bad,.res.warn{border:1px solid currentColor}
.tag{display:inline-block;font-size:var(--fs-xs);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
/* 회독 (T072): 세트 줄 배지·완료 도장·숫자. 색 + 글자로 구분 */
.rd{display:inline-block;font-size:var(--fs-xs);font-weight:700;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:0 10px;white-space:nowrap}
.rd.live{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)} .rd.met{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{align-items:center;gap:2px;padding:12px}.stats b{font-size:var(--fs-xl);line-height:1.2}
.stamp{align-self:center;border:3px solid var(--stamp);color:var(--stamp);border-radius:12px;padding:2px 16px;font-size:var(--fs-l);font-weight:700;transform:rotate(-4deg)}
.rbig{font-size:96px;font-weight:700;line-height:1;letter-spacing:-.02em;text-align:center;margin:-2px 0 6px}
.rpop{animation:rpop .3s var(--ease-out) both}@keyframes rpop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rpop{animation:none}}
input[type=text],input[type=search],input[type=time],textarea{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px;font-size:var(--fs-l)}
input[type=search]{font-size:var(--fs-m)}
textarea{min-height:100px;font-size:var(--fs-m)}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.reqrow{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.reqrow .btn{display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.rows>button,.rows>div{display:flex;gap:10px;align-items:center;min-height:56px;padding:8px 4px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.rows .grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}
.dot.s1{position:relative;overflow:hidden}.dot.s1::after{content:"";position:absolute;inset:0 50% 0 0;background:var(--muted)} /* T063 U2: half-filled dot without a gradient */ .dot.s2,.dot.s3,.dot.s4{background:var(--muted)}
.dot.s3{border-color:var(--text);background:var(--text)} .dot.s4{border-color:var(--ok);background:var(--ok)}
.more{display:flex;flex-direction:column;gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--box);max-width:100%}
.cal i.on{background:var(--muted)}
.lvl{height:10px;background:var(--box);border-radius:99px;overflow:hidden}.lvl>i{display:block;height:100%;background:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--surface);min-height:var(--tap-min);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.set-row{display:flex;align-items:center;gap:10px;min-height:56px}
/* v2: track still looks 52x32, but the tap area is 68x48 (transparent border, background clipped to the track) */
.switch{width:68px;height:48px;flex:none;appearance:none;border-radius:99px;background:#8A93AD;background-clip:padding-box;position:relative;cursor:pointer;border:8px solid transparent;margin:-8px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch:checked{background-color:var(--accent)} .switch:checked::after{left:23px}
.sheet-bg{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.28);display:flex;align-items:flex-end}
.sheet{background:var(--phone);width:100%;border-radius:22px 22px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.sheet .rows>button{font-size:var(--fs-m)}
.toast{position:absolute;left:20px;right:20px;top:60px;z-index:30;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 16px;font-size:var(--fs-s);text-align:center}
.sim{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:2px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:100%}
.sim .link{min-height:var(--tap-min);font-size:var(--fs-xs)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:var(--fs-xs);color:var(--muted)}
.week i{display:block;width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);margin:0 auto 4px}
.week i.on{background:var(--accent);border-color:var(--accent)} .week i.today{border-color:var(--accent);border-width:3px}
.path>div{display:flex;gap:12px;align-items:center;min-height:42px}
.mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;flex:none;color:var(--on-accent)}
.mark.done{background:var(--accent);border-color:var(--accent)} .mark.now{border:4px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--surface);cursor:pointer;min-height:40px;position:relative} /* T063 U8: 40px seen, 48px tap via ::after */
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bell{position:relative}.bell.on::after{content:"";position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.newdot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
.newdot.off{background:transparent}
.grp{font-size:var(--fs-xs);color:var(--muted);letter-spacing:.04em;margin-top:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-block:4px;margin-inline:-20px;padding-inline:20px}
.chips.scroll .chip{flex:none}
.video{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:var(--box);border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:28px;color:var(--muted)}
.widget-prev{align-self:center;width:170px;max-width:100%;aspect-ratio:1;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:12px}
.sel{min-height:var(--tap-min);border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px}
.plus{display:inline-block;font-size:var(--fs-xs);font-weight:700;border:1px solid var(--warn);color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:0 8px;white-space:nowrap}
.filter-row{display:flex;align-items:center;gap:8px}
.btn.sm{min-height:40px;padding:0 14px;font-size:var(--fs-s)}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:15px;line-height:1;margin-left:4px}
.chip.on{background:var(--box)}
/* chip row (word list) */
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding:6px 20px;scroll-snap-type:x proximity}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{flex:none;min-height:40px;padding:0 14px;font-size:var(--fs-s);scroll-snap-align:start}
.chiprow .chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chiprow .chip.x{width:var(--tap-min);padding:0;display:grid;place-items:center}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 0;min-height:var(--tap-min);font:inherit;font-size:var(--fs-s);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
.slgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font:inherit;color:inherit;cursor:pointer;min-height:104px}
.slcard .slnum{font-size:26px;font-weight:700;line-height:1}
.titlemenu{background:none;border:0;font:inherit;font-size:var(--fs-l);font-weight:700;color:var(--text);padding:6px 0;min-height:var(--tap-min);cursor:pointer}
.scene{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.scene-art{display:block;width:100%;height:auto}
.spot{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.spot i{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 0 0 rgba(47,53,59,.3);animation:ripple 1.8s infinite} /* T063 U1: ring .45 -> .3 */
.spot.good i{background:#3c9a5f;border-color:#3c9a5f;animation:none}.spot.bad i{background:#c0392b;border-color:#c0392b;animation:none}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(47,53,59,.3)}70%{box-shadow:0 0 0 14px rgba(47,53,59,0)}100%{box-shadow:0 0 0 0 rgba(47,53,59,0)}}
@media (prefers-reduced-motion:reduce){.spot i{animation:none}}
.minicard{position:absolute;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 2px 8px rgba(15,26,59,.15);font:inherit;color:inherit;cursor:pointer;min-width:110px}
.minicard b{font-size:var(--fs-l)}
.listhead{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.link.strong{font-weight:700}.link:disabled{opacity:.35;cursor:default}
/* grouped settings list (iOS-style inset groups) */
.lprev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lprev mark{background:#ffe680;color:#1c2126;border-radius:3px;padding:0 2px}
.lp-word{font-size:26px;font-weight:700}.lp-mean{color:var(--muted)}
.lp-card{align-self:stretch;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:var(--fs-s)}
.lp-btn{align-self:stretch;text-align:center;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px;font-weight:700}
.glabel mark{background:#ffe680;color:#1c2126;border-radius:3px;padding:0 3px}
.glabel{font-size:var(--fs-xs);color:var(--muted);margin:14px 16px 6px}
.glist{background:var(--surface);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.glist>.grow-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:inherit}
.glist>.grow-row:first-child{border-top:0}
button.grow-row,a.grow-row{cursor:pointer}
a.grow-row{text-decoration:none}
.grow-row .val{color:var(--muted);font-size:var(--fs-s)}
.grow-row .chev{color:var(--muted)}
.gfoot{font-size:var(--fs-xs);color:var(--muted);margin:6px 16px 0;line-height:1.45}
.glist>.grow-row.danger{color:var(--bad)}
.glist input.timepill,.glist select.timepill{width:auto;min-height:44px;height:auto;flex:none;margin:0;border:0;padding:6px 10px;font-size:var(--fs-s);background:var(--box);border-radius:8px}
.timepill{font:inherit;font-size:var(--fs-s);border:0;background:var(--box);color:var(--text);border-radius:8px;padding:6px 10px;min-height:var(--tap-min)}
/* examples: one card, next one peeking, counter + arrows below */
.exc{display:flex;flex-direction:column;gap:8px}
.exc .track{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-20px;padding:0 20px;scroll-padding-inline:20px;overscroll-behavior-x:contain}
.exc .track::-webkit-scrollbar{display:none}
.exc .slide{flex:0 0 calc(100% - 32px);scroll-snap-align:start;scroll-snap-stop:always;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative;box-sizing:border-box}
.exc .slide .ko{font-size:var(--fs-m);line-height:1.6;padding-right:48px}
.exc .slide .tip{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);line-height:1.4}
.exc .slide .play{position:absolute;top:4px;right:4px}
.exc .slide.more{align-items:center;justify-content:center;background:var(--box)}

/* press: shrink to .97 while held, spring back on release */
.btn,.icon,.chip,.link,.seg button,.tabs button,.slcard,.lang,.rows>button,button.grow-row,.titlemenu,.link-row{
  transition:transform var(--t-mid) var(--ease-back),background-color var(--t-fast) ease-out,color var(--t-fast) ease-out}
.btn:active,.icon:active,.chip:active,.link:active,.seg button:active,.tabs button:active,.slcard:active,.lang:active,.rows>button:active,button.grow-row:active,.titlemenu:active,.link-row:active{
  transform:scale(.97);transition:transform var(--t-fast) ease-out}
.btn:disabled:active,.link:disabled:active{transform:none}
/* screen / tab change: slide in from the side we are moving to; next card in a session: short rise */
#screen.enter-r{animation:v2inR var(--t-mid) var(--ease-out)}
#screen.enter-l{animation:v2inL var(--t-mid) var(--ease-out)}
#screen.enter-f{animation:v2rise var(--t-mid) var(--ease-out)}
@keyframes v2inR{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes v2inL{from{transform:translateX(-32px);opacity:0}to{transform:none;opacity:1}}
@keyframes v2rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
/* 알았어요 → card leaves to the right, 몰랐어요 → to the left, with a mark popping in the middle */
#screen.out-r{animation:v2outR 200ms ease-out forwards}
#screen.out-l{animation:v2outL 200ms ease-out forwards}
#foot.out{animation:v2fadeOut 200ms ease-out forwards}
@keyframes v2outR{0%{transform:none;opacity:1}60%{opacity:.9}100%{transform:translateX(70%) rotate(4deg);opacity:0}}
@keyframes v2outL{0%{transform:none;opacity:1}60%{opacity:.9}100%{transform:translateX(-70%) rotate(-4deg);opacity:0}}
@keyframes v2fadeOut{to{opacity:0}}
@keyframes v2fadeIn{from{opacity:0}to{opacity:1}}
#phone.swipe-ok::after,#phone.swipe-bad::after{position:absolute;left:50%;top:42%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;
  display:grid;place-items:center;font-size:44px;font-weight:700;color:#fff;z-index:25;pointer-events:none;animation:v2pop var(--t-slow) var(--ease-back) both}
#phone.swipe-ok::after{content:"✓"/"";background:var(--ok)}

.res.ok,.res.bad,.res.warn{animation:v2fadeIn var(--t-mid) var(--ease-out)}
.res.ok::before,.res.bad::before,.res.warn::before{animation:v2pop var(--t-slow) var(--ease-back) both}
.res.bad{animation:v2fadeIn var(--t-mid) var(--ease-out),v2shake 280ms ease-out}
@keyframes v2shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

y":null,"dict_examples":[{"ko":"주말을 교외에서 보내다.","en":"To spend the weekend in the suburbs.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"나는 지난 주말에 아내와 같이 영화를 보았다.","en":"Last weekend I watched a movie with my wife.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"주말까지는 여기 있어야겠습니다.","en":"I will have to stay here until the weekend.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"The 말 in 주말 means “end”: the end of the week. Same pattern in 월말 (end of month) and 연말 (end of year).","contract_en":""},{"id":"n00230","kind":"word","ko":"맛있다","yo":"맛있어요","en":"to be delicious","pos":"형용사","usage":"","contract":"","examples":[{"id":"e00267","ko":"이 집 떡볶이가 정말 맛있어요.","en":"This place's tteokbokki is really good.","speech_level":"해요","cloze":"맛있어요","extra_word":"떡볶이 = tteokbokki","extra_grammar":"","tip":"","tip_en":""},{"id":"e00268","ko":"할머니 음식은 다 맛있어요.","en":"Everything Grandma cooks is delicious.","speech_level":"해요","cloze":"맛있어요","extra_word":"음식 = food","extra_grammar":"","tip":"","tip_en":""},{"id":"e09326","ko":"이 커피 맛있네요!","en":"This coffee is good!","speech_level":"해요","cloze":"맛있네요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09327","ko":"이거 어때요? — 아주 맛있어요.","en":"How is this? — It's really delicious.","speech_level":"해요","cloze":"맛있어요","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09328","ko":"우리 동네 빵집은 빵이 아주 맛있어요.","en":"The bakery in my neighborhood has really good bread.","speech_level":"해요","cloze":"맛있어요","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"마딛따","roman":"masisseoyo","explain":"“맛있어요”는 [마시써요]라고 읽어요. 식사 전에 “잘 먹겠습니다”, 식사 후에 “잘 먹었습니다”라고 인사해요.","video_url":"","video_title":"","phrases":[],"pron_source":"curriculum","pron_why":{"ch":[[0,"f","liaison",1],[1,"f","final",-1],[2,"c","tense",-1]],"rules":["liaison","final","tense"],"long":[]},"dict_examples":[{"ko":"맛있는 과자.","en":"Delicious cookies.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"맛있어요 is read [마시써요]. Before eating, Koreans say 잘 먹겠습니다; afterwards, 잘 먹었습니다.","contract_en":""},{"id":"n00282","kind":"word","ko":"같이","yo":"","en":"Together","pos":"부사","usage":"같이 = together (everyday speech). 함께 means the same but sounds more formal.","contract":"","examples":[{"id":"e00687","ko":"저는 가족과 같이 살아요.","en":"I live with my family.","speech_level":"해요","cloze":"같이","extra_word":"살다 = to live","extra_grammar":"","tip":"","tip_en":""},{"id":"e00688","ko":"친구와 같이 숙제를 해요.","en":"I do homework together with a friend.","speech_level":"해요","cloze":"같이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e10473","ko":"우리 같이 점심 먹어요.","en":"Let's have lunch together.","speech_level":"해요","cloze":"같이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e10474","ko":"같이 가요? — 네, 좋아요. 저도 가고 싶어요.","en":"Shall we go together? — Yes, sure. I want to go too.","speech_level":"해요","cloze":"같이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e10475","ko":"주말에 동생하고 같이 요리했어요.","en":"On the weekend, I cooked together with my younger sibling.","speech_level":"해요","cloze":"같이","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"가치","roman":"gachi","explain":"'같이 먹어요'는 '우리 같이 먹을까요?'라는 뜻으로도 써요. 친구에게 같이 하자고 말할 때 좋아요.","video_url":"","video_title":"","phrases":[],"pron_source":"curriculum","pron_why":{"ch":[[0,"f","palatal",1]],"rules":["palatal"],"long":[]},"dict_examples":[{"ko":"친구와 같이 사업을 하다.","en":"To run a business together with a friend.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"모두 같이 갑시다.","en":"Let's all go together.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"삼 년 동안 같이 고생했다.","en":"We struggled together for three years.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"어제 같이 저녁 먹은 사람이 누구지?","en":"Who was the person I had dinner with yesterday?","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"일요일에 그는 아내와 같이 등산을 가곤 했다.","en":"On Sundays he used to go hiking with his wife.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"'같이 먹어요' can also mean 'Let's eat together.' It is a handy way to invite a friend to do something with you.","contract_en":""},{"id":"n00303","kind":"word","ko":"어디","yo":"","en":"Where","pos":"대명사","usage":"","contract":"","examples":[{"id":"e00143","ko":"선생님 집이 어디예요?","en":"Where is your house, teacher?","speech_level":"해요","cloze":"어디","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00144","ko":"지금 어디 가요?","en":"Where are you going now?","speech_level":"해요","cloze":"어디","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08933","ko":"어디 살아요? — 서울에 살아요.","en":"Where do you live? — I live in Seoul.","speech_level":"해요","cloze":"어디","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08934","ko":"어디에서 만나요? — 카페에서 만나요.","en":"Where shall we meet? — Let's meet at a cafe.","speech_level":"해요","cloze":"어디","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08935","ko":"여기가 어디예요? — 여기는 명동이에요.","en":"Where is this? — This is Myeongdong.","speech_level":"해요","cloze":"어디","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"어디","roman":"eodi","explain":"어디는 where이지만 ‘어딘가(somewhere)’라는 뜻도 돼요. “어디 가요?”는 where나 somewhere로 모두 들릴 수 있어요. 억양을 올리면 ‘어디 가세요?’처럼 가볍게 인사하는 말이 돼요.","video_url":"","video_title":"","phrases":[{"ko":"어디 보자","example":"어디 보자, 제 가방이 어디 있지?","en":"Let me see...","nuance_ko":"무엇을 찾거나 생각할 때 혼잣말처럼","source":"AI","nuance_en":"said like a mutter to yourself while looking for or thinking about something","en_equiv":"Let me see..."}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"학교가 어디냐?","en":"Where is the school?","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"어디가 이장 댁이오?","en":"Which one is the village head's house?","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"실례지만 어디서 오셨습니까?","en":"Excuse me, where are you from?","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"내가 그걸 어디 두었더라?","en":"Where did I put that?","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"어디 means 'where', but it can also mean 'somewhere'. 어디 가요? can be 'Where are you going?' or 'Are you going somewhere?'. With rising intonation it is often just a casual greeting.","contract_en":""},{"id":"n00330","kind":"word","ko":"친구","yo":"","en":"Friend","pos":"명사","usage":"","contract":"","examples":[{"id":"e00689","ko":"고향 친구가 서울에 와요.","en":"A friend from my hometown is coming to Seoul.","speech_level":"해요","cloze":"친구","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00690","ko":"친구 집은 학교 근처예요.","en":"My friend's house is near the school.","speech_level":"해요","cloze":"친구","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08444","ko":"주말에 친구를 만나요.","en":"I meet my friend on weekends.","speech_level":"해요","cloze":"친구","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08445","ko":"제 친구는 서울에 살아요.","en":"My friend lives in Seoul.","speech_level":"해요","cloze":"친구","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08446","ko":"친구 생일이에요. 선물을 사요.","en":"It's my friend's birthday. I'm buying a present.","speech_level":"해요","cloze":"친구","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"친구","roman":"chingu","explain":"한국에서 친구는 보통 나이가 같은 사람이에요. 나이가 다르면 “형, 오빠, 누나, 언니”나 “동생”이라고 불러요.","video_url":"","video_title":"","phrases":[{"ko":"친구 따라 강남 간다","example":"친구 따라 강남 간다더니, 저도 같이 운동을 시작했어요.","en":"to tag along with a friend (proverb)","nuance_ko":"친구가 하니까 나도 따라 할 때","source":"AI","nuance_en":"said when someone does something because a friend is doing it","en_equiv":"to tag along with a friend (proverb)"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"친구를 사귀다.","en":"to make friends","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"친구와 다투다.","en":"to quarrel with a friend","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"우리 동네에는 같이 놀 만한 친구가 없다.","en":"There is no friend in our neighborhood worth playing with.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그는 나의 둘도 없는 친구다.","en":"He is my one and only friend.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"In Korea, 친구 usually means someone your own age. Older friends become 형, 오빠, 누나 or 언니, and younger ones are called 동생.","contract_en":""},{"id":"n00332","kind":"word","ko":"아이","yo":"","en":"Child / Kid","pos":"명사","usage":"아이 = child. 아기 = baby.","contract":"","examples":[{"id":"e01259","ko":"아이가 몇 살이에요?","en":"How old is your child?","speech_level":"해요","cloze":"아이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01260","ko":"아이들이 놀이터에서 놀아요.","en":"The kids are playing at the playground.","speech_level":"해요","cloze":"아이","extra_word":"놀이터 = playground","extra_grammar":"","tip":"","tip_en":""},{"id":"e08515","ko":"아이 이름은 시우예요.","en":"The child's name is Siu.","speech_level":"해요","cloze":"아이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08516","ko":"이 아이는 제 친구의 딸이에요.","en":"This child is my friend's daughter.","speech_level":"해요","cloze":"아이","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08517","ko":"제 친구는 아이가 한 명 있어요.","en":"My friend has one child.","speech_level":"해요","cloze":"아이","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"아이","roman":"ai","explain":"아이는 내 아이에게도, 다른 사람의 아이에게도 써요. 말할 때는 “애”로 줄여서 많이 말해요. “애가 참 귀여워요”처럼요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"아니, 먹는 것을 가지고 어른이 아이를 울리면 어떻게 해요?","en":"Oh no, what are you doing making a child cry over food, as an adult?","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"놀이터에서는 고만고만한 아이들이 미끄럼을 탄다, 그네를 탄다 하며 떠들고 있었다.","en":"At the playground, kids of similar size were making noise, going on the slide and the swings.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"아이 is used for your own child and for any other child. In speech it is often shortened to 애, as in 애가 참 귀여워요 (“the kid is so cute”).","contract_en":""},{"id":"n00336","kind":"word","ko":"손님","yo":"","en":"Guest / Customer","pos":"명사","usage":"","contract":"","examples":[{"id":"e01227","ko":"주말에는 이 식당에 손님이 많아요.","en":"This restaurant has lots of customers on weekends.","speech_level":"해요","cloze":"손님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01228","ko":"손님, 여기 메뉴 있어요.","en":"Here's the menu, sir/ma'am.","speech_level":"해요","cloze":"손님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09746","ko":"가게에 손님이 없어요.","en":"There are no customers in the shop.","speech_level":"해요","cloze":"손님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09747","ko":"손님, 이 빵 맛있어요.","en":"Sir/Madam, this bread is delicious.","speech_level":"해요","cloze":"손님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09748","ko":"손님이에요? — 아니요, 저는 직원이에요.","en":"Are you a customer? — No, I'm an employee.","speech_level":"해요","cloze":"손님","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"손님","roman":"sonnim","explain":"손님은 가게의 customer도 되고 집에 오는 guest도 돼요. 직원은 모르는 customer를 “손님”이라고 불러요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"손님을 받다.","en":"To receive guests.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"해장국집 안에는 손님 대여섯이 해장국을 먹고 있었다.","en":"Inside the hangover-soup restaurant, five or six customers were eating soup.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"초대 손님.","en":"An invited guest.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"손님 대접을 하다.","en":"To entertain a guest.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"아침나절이어서인지 객주 안엔 손님이 없었다.","en":"Perhaps because it was morning, there were no customers in the inn.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"갑자기 손님이 오셔서 집을 비울 수가 없어요.","en":"A guest suddenly arrived, so I can't leave the house.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"외국 손님을 초청해 치르는 행사.","en":"An event held by inviting foreign guests.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"손님은 왕이라고 하지만 직원도 사람이에요.","en":"They say the customer is king, but employees are people too.","src":"AI 생성 · 검수"}],"explain_en":"손님 can mean a customer in a shop or a guest who visits your home. Shop staff call a customer they do not know 손님.","contract_en":""},{"id":"n00341","kind":"word","ko":"영화배우","yo":"","en":"Movie actor/actress","pos":"명사","usage":"","contract":"","examples":[{"id":"e01199","ko":"그 영화배우는 미국 영화에도 나와요.","en":"That film actor appears in American movies too.","speech_level":"해요","cloze":"영화배우","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01200","ko":"이 영화배우 영화는 다 봤어요.","en":"I've seen all of this actor's films.","speech_level":"해요","cloze":"영화배우","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08184","ko":"영화배우는 영화에서 연기를 해요.","en":"A movie actor acts in films.","speech_level":"해요","cloze":"영화배우","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e11709","ko":"영화배우가 되고 싶어요. 연기를 배울 거예요.","en":"I want to become a movie actor. I'm going to learn acting.","speech_level":"해요","cloze":"영화배우","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11710","ko":"저 영화배우를 알아요? — 네, 아주 유명해요.","en":"Do you know that movie star? — Yes, he's very famous.","speech_level":"해요","cloze":"영화배우","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"영화배우","roman":"yeonghwabaeu","explain":"보통은 그냥 “배우”라고 말해요. 영화에 나오면 영화배우, 드라마에 나오면 드라마 배우라고 구분할 수 있어요.","video_url":"","video_title":"","phrases":[{"ko":"영화배우 뺨치다","example":"그 사람은 얼굴이 영화배우 뺨쳐요.","en":"to rival a movie star (in looks)","nuance_ko":"잘생겼다고 크게 칭찬할 때","source":"AI","nuance_en":"a big compliment on someone's good looks","en_equiv":"to rival a movie star (in looks)"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[],"explain_en":"People usually just say 배우 (actor). If you want to be specific, an actor in films is a 영화배우 and one in dramas is a 드라마 배우.","contract_en":""},{"id":"n00342","kind":"word","ko":"부모님","yo":"","en":"Parents","pos":"명사","usage":"","contract":"","examples":[{"id":"e01263","ko":"부모님 사진이 제 방에 있어요.","en":"There's a photo of my parents in my room.","speech_level":"해요","cloze":"부모님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01264","ko":"부모님 집은 서울에 있어요.","en":"My parents' house is in Seoul.","speech_level":"해요","cloze":"부모님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08486","ko":"부모님의 직업은 선생님이에요.","en":"My parents are both teachers.","speech_level":"해요","cloze":"부모님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08487","ko":"부모님 선물을 사요.","en":"I'm buying a gift for my parents.","speech_level":"해요","cloze":"부모님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08488","ko":"친구의 부모님 집은 제주도에 있어요.","en":"My friend's parents' house is on Jeju Island.","speech_level":"해요","cloze":"부모님","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"부모님","roman":"bumonim","explain":"부모님은 아버지와 어머니 두 분을 함께 부르는 공손한 말이에요. “부모” 뒤에 높이는 말 “-님”이 붙었어요. “우리 부모님”이라고 자주 말해요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"부모님의 은혜에 보답하다.","en":"to repay one's parents' kindness","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"부모님 is the polite word for father and mother together. It is 부모 (parents) plus the respectful ending -님. People often say 우리 부모님 (“our parents”) even when they mean their own.","contract_en":""},{"id":"n00343","kind":"word","ko":"가족","yo":"","en":"Family","pos":"명사","usage":"","contract":"","examples":[{"id":"e00093","ko":"가족이 다 서울에 살아요.","en":"My whole family lives in Seoul.","speech_level":"해요","cloze":"가족","extra_word":"살다 = to live","extra_grammar":"","tip":"","tip_en":""},{"id":"e00094","ko":"이거 우리 가족 사진이에요.","en":"This is a photo of my family.","speech_level":"해요","cloze":"가족","extra_word":"사진 = photo","extra_grammar":"","tip":"","tip_en":""},{"id":"e08456","ko":"가족은 몇 명이에요? — 네 명이에요.","en":"How many people are in your family? — Four.","speech_level":"해요","cloze":"가족","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08457","ko":"저는 가족이 다섯 명이에요.","en":"There are five people in my family.","speech_level":"해요","cloze":"가족","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08458","ko":"제 가족은 한국에 없어요.","en":"My family isn't in Korea.","speech_level":"해요","cloze":"가족","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"가족","roman":"gajok","explain":"'식구'라는 말도 많이 써요. 한자로 '먹을 식(食) + 입 구(口)', 같이 밥 먹는 사람이라는 뜻이에요. 그래서 같이 사는 사람이나 같은 회사 사람도 '한 식구'라고 해요.","video_url":"","video_title":"","phrases":[{"ko":"가족 같은 회사","example":"면접에서 '가족 같은 회사'라고 해서 좀 걱정돼요.","en":"'a company like a family' (often ironic)","nuance_ko":"직장인들이 비꼬는 농담으로 많이 씀","source":"AI","nuance_en":"often used ironically by office workers as a joke","en_equiv":"'a company like a family' (often ironic)"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"잃어버렸던 아이가 열흘 만에 가족 품으로 돌아왔다.","en":"The lost child returned to the family's arms after ten days.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"전시회에 가족 단위의 관람객들이 줄을 잇고 있다.","en":"Families are visiting the exhibition one after another.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Koreans also say 식구, written with the characters for 'eat' and 'mouth': the people you share meals with. That's why people who live together, or even coworkers, can be called 한 식구 (one family).","contract_en":""},{"id":"n00348","kind":"word","ko":"주부","yo":"","en":"homemaker","pos":"명사","usage":"","contract":"","examples":[{"id":"e01139","ko":"제 언니는 주부예요.","en":"My older sister is a homemaker.","speech_level":"해요","cloze":"주부","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01140","ko":"결혼하고 주부가 됐어요.","en":"I became a homemaker after getting married.","speech_level":"해요","cloze":"주부","extra_word":"결혼하다 = to get married","extra_grammar":"","tip":"","tip_en":""},{"id":"e08185","ko":"주부는 집에서 집안일을 해요.","en":"A homemaker does the housework at home.","speech_level":"해요","cloze":"주부","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e08702","ko":"저는 주부가 아니에요. 회사원이에요.","en":"I'm not a homemaker. I'm an office worker.","speech_level":"해요","cloze":"주부","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08703","ko":"그 사람은 주부예요? — 아니요, 요리사예요.","en":"Is that person a homemaker? — No, a chef.","speech_level":"해요","cloze":"주부","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"주부","roman":"jubu","explain":"“주부”는 사람이고, 하는 일은 “살림”이나 “집안일”이라고 해요: 살림을 해요.","video_url":"","video_title":"","phrases":[{"ko":"주부 9단","example":"저는 요리도 청소도 잘해요. 주부 9단이에요.","en":"a master homemaker (lit. 9th-dan homemaker)","nuance_ko":"집안일을 아주 잘하는 사람","source":"AI","nuance_en":"a person who is excellent at housework","en_equiv":"a master homemaker (lit. 9th-dan homemaker)"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"주부의 손길.","en":"a homemaker's touch","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"주부를 대상으로 한 강습.","en":"a class aimed at homemakers","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"요즘의 주부들은 물건을 살 때 할인 판매 기간을 많이 이용한다.","en":"Homemakers these days often use discount sale periods when buying things.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"여성의 학력이 높아지면서 취업을 희망하는 주부가 늘고 있다.","en":"As women's education levels rise, more homemakers want to get jobs.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"주부 is the person; the work is called 살림 or 집안일 (housework): 살림을 해요.","contract_en":""},{"id":"n00349","kind":"word","ko":"배우","yo":"","en":"Actor / Actress","pos":"명사","usage":"","contract":"","examples":[{"id":"e01201","ko":"그 배우는 텔레비전에 자주 나와요.","en":"That actor is on TV a lot.","speech_level":"해요","cloze":"배우","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01202","ko":"제 동생은 배우예요.","en":"My younger sibling is an actor.","speech_level":"해요","cloze":"배우","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08186","ko":"배우는 카메라 앞에서 연기를 해요.","en":"An actor performs in front of the camera.","speech_level":"해요","cloze":"배우","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e08700","ko":"그 배우는 정말 유명해요.","en":"That actor is really famous.","speech_level":"해요","cloze":"배우","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08701","ko":"배우가 영화에서 울어요.","en":"The actor cries in the movie.","speech_level":"해요","cloze":"배우","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"배우","roman":"baeu","explain":"배우는 남자와 여자에게 모두 써요. “여배우”도 있지만 보통 “배우”라고만 해요. 영화 배우는 “영화배우”예요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"영화의 주역을 맡은 배우.","en":"the actor who plays the lead in the film","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"이 영화는 배우들의 열연이 돋보였다.","en":"In this film, the actors' passionate performances stood out.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그는 당대 최고의 배우로 이름을 날렸다.","en":"He became famous as the best actor of his time.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"배우 is used for both men and women. 여배우 exists, but people usually just say 배우. A film actor is a 영화배우.","contract_en":""},{"id":"n00350","kind":"word","ko":"가수","yo":"","en":"Singer","pos":"명사","usage":"","contract":"","examples":[{"id":"e01203","ko":"저 사람은 가수예요? — 아니요, 배우예요.","en":"Is that person a singer? — No, an actor.","speech_level":"해요","cloze":"가수","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01204","ko":"저는 이 가수 노래를 매일 들어요.","en":"I listen to this singer's songs every day.","speech_level":"해요","cloze":"가수","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08187","ko":"가수는 콘서트에서 노래를 불러요.","en":"A singer sin ideo_url":"","video_title":"","phrases":[],"pron_source":"curriculum","pron_why":{"ch":[[2,"c","tense",-1]],"rules":["tense","long"],"long":[0]},"dict_examples":[{"ko":"대학생 인턴.","en":"a university student intern","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"교정은 축제를 즐기는 대학생들로 넘쳐 났다.","en":"The campus was overflowing with university students enjoying the festival.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"School level + 생 = a student of that school: 초등학생 (elementary), 중학생, 고등학생, then 대학생.","contract_en":""},{"id":"n00361","kind":"word","ko":"선생님","yo":"","en":"Teacher","pos":"명사","usage":"","contract":"","examples":[{"id":"e00019","ko":"저는 한국어 선생님이에요.","en":"I'm a Korean teacher.","speech_level":"해요","cloze":"선생님","extra_word":"저분 = that person (polite)","extra_grammar":"","tip":"","tip_en":""},{"id":"e00020","ko":"선생님, 이거 뭐예요?","en":"Teacher, what is this?","speech_level":"해요","cloze":"선생님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08190","ko":"선생님은 학교에서 한국어를 가르쳐요.","en":"The teacher teaches Korean at school.","speech_level":"해요","cloze":"선생님","extra_word":"","extra_grammar":"job-subject","tip":"","tip_en":""},{"id":"e08361","ko":"제 친구는 영어 선생님이에요.","en":"My friend is an English teacher.","speech_level":"해요","cloze":"선생님","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08362","ko":"선생님, 안녕히 가세요.","en":"Goodbye, teacher.","speech_level":"해요","cloze":"선생님","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"선생님","roman":"seonsaengnim","explain":"학교 선생님만이 아니라 의사, 작가, 그리고 이름을 모르는 어른도 '선생님'이라고 불러요. 한국어는 사람에게 '당신'을 잘 쓰지 않아서, 이름 대신 '선생님'을 써요.","video_url":"https://www.youtube.com/results?search_query=선생님+한국어","video_title":"왜 '선생님'에는 '님'이 붙을까? (예시)","phrases":[{"ko":"선생님, 여기서 이러시면 안 돼요","example":"선생님, 여기서 이러시면 안 돼요. 여기는 금연이에요.","en":"Sir/Ma'am (polite address to an adult stranger)","nuance_ko":"모르는 어른을 정중하게 부를 때의 '선생님'","source":"AI","nuance_en":"‘선생님’ used to politely address an adult  시절.","en":"one's student days","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"3학년 학생.","en":"a third-year student","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"중학교 학생.","en":"a middle school student","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그의 도장에는 태권도를 배우려는 학생들로 항상 만원이다.","en":"His dojo is always full of students wanting to learn taekwondo.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"In shops or on the bus, people call out '학생!' to any young person whose name they don't know — even if they aren't actually a student.","contract_en":""},{"id":"n00368","kind":"word","ko":"미국","yo":"","en":"the United States","pos":"명사","usage":"","contract":"","examples":[{"id":"e00035","ko":"제 친구는 지금 미국에 살아요.","en":"My friend lives in the US now.","speech_level":"해요","cloze":"미국","extra_word":"살다 = to live","extra_grammar":"","tip":"","tip_en":""},{"id":"e00036","ko":"지금 미국은 밤이에요.","en":"It's night in the US right now.","speech_level":"해요","cloze":"미국","extra_word":"밤 = night","extra_grammar":"","tip":"","tip_en":""},{"id":"e08391","ko":"뉴욕은 미국에 있어요.","en":"New York is in the United States.","speech_level":"해요","cloze":"미국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08392","ko":"미국은 아주 커요.","en":"The United States is very big.","speech_level":"해요","cloze":"미국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08393","ko":"미국에서는 영어를 써요.","en":"In the United States, people speak English.","speech_level":"해요","cloze":"미국","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"미국","roman":"miguk","explain":"미국 사람은 “미국인”이라고도 해요. “인”은 사람이라는 뜻이에요. 미국인은 뉴스나 글에서 많이 써요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[],"explain_en":"An American can be 미국 사람 or 미국인. 인 means “person”. 미국인 is more common in news and writing.","contract_en":""},{"id":"n00369","kind":"word","ko":"일본","yo":"","en":"Japan","pos":"명사","usage":"","contract":"","examples":[{"id":"e01303","ko":"일본은 한국에서 비행기로 두 시간 걸려요.","en":"Japan is two hours from Korea by plane.","speech_level":"해요","cloze":"일본","extra_word":"걸리다 = to take (time)","extra_grammar":"","tip":"","tip_en":""},{"id":"e01304","ko":"작년 여름에 일본으로 여행을 갔어요.","en":"I traveled to Japan last summer.","speech_level":"해요","cloze":"일본","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08396","ko":"일본은 한국 옆에 있어요.","en":"Japan is next to Korea.","speech_level":"해요","cloze":"일본","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08397","ko":"일본 회사에서 일해요.","en":"I work at a Japanese company.","speech_level":"해요","cloze":"일본","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08398","ko":"다음 주에 일본에 가요.","en":"I'm going to Japan next week.","speech_level":"해요","cloze":"일본","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"일본","roman":"ilbon","explain":"두 나라 이름을 짧게 합칠 때가 있어요. 한국 + 일본 = “한일”, 한국 + 중국 = “한중”이에요. 뉴스에 자주 나와요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[],"explain_en":"Korean often joins two country names into a short word: 한국 + 일본 = 한일, 한국 + 중국 = 한중. You will see these in the news.","contract_en":""},{"id":"n00372","kind":"word","ko":"영국","yo":"","en":"United Kingdom","pos":"명사","usage":"","contract":"","examples":[{"id":"e00793","ko":"영국 날씨는 자주 흐려요.","en":"The weather in the UK is often cloudy.","speech_level":"해요","cloze":"영국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00794","ko":"영국 사람들은 차를 많이 마셔요.","en":"British people drink a lot of tea.","speech_level":"해요","cloze":"영국","extra_word":"차 = tea","extra_grammar":"","tip":"","tip_en":""},{"id":"e08423","ko":"제 동생은 영국에서 대학교에 다녀요.","en":"My younger sibling goes to university in the UK.","speech_level":"해요","cloze":"영국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08424","ko":"영국 드라마를 자주 봐요.","en":"I often watch British dramas.","speech_level":"해요","cloze":"영국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08425","ko":"런던은 영국의 수도예요.","en":"London is the capital of the UK.","speech_level":"해요","cloze":"영국","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"영국","roman":"yeongguk","explain":"한국에서 영국은 보통 UK 전체예요. 축구에서는 “잉글랜드”라고 많이 불러요.","video_url":"","video_title":"","phrases":[{"ko":"영국 신사","example":"그 사람은 정말 영국 신사 같아요.","en":"a true gentleman (lit. an English gentleman)","nuance_ko":"예의 바르고 점잖은 남자를 칭찬할 때","source":"AI","nuance_en":"praises a polite, refined man","en_equiv":"a true gentleman (lit. an English gentleman)"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[],"explain_en":"In everyday Korean, 영국 usually means the whole UK. In football (soccer), people say 잉글랜드 for England.","contract_en":""},{"id":"n00373","kind":"word","ko":"한국","yo":"","en":"Korea","pos":"명사","usage":"","contract":"","examples":[{"id":"e00039","ko":"저는 한국 친구가 많아요.","en":"I have a lot of Korean friends.","speech_level":"해요","cloze":"한국","extra_word":"많다 = to be many, a lot","extra_grammar":"","tip":"","tip_en":""},{"id":"e00040","ko":"저는 지금 한국에 살아요.","en":"I live in Korea now.","speech_level":"해요","cloze":"한국","extra_word":"살다 = to live","extra_grammar":"","tip":"","tip_en":""},{"id":"e08366","ko":"한국 돈은 원이에요.","en":"Korean money is the won.","speech_level":"해요","cloze":"한국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08367","ko":"서울은 한국에 있어요.","en":"Seoul is in Korea.","speech_level":"해요","cloze":"한국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08368","ko":"한국은 처음이에요? — 네, 처음이에요.","en":"Is this your first time in Korea? — Yes, it's my first time.","speech_level":"해요","cloze":"한국","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"한국","roman":"hanguk","explain":"한국 사람들은 자기 나라를 말할 때 '한국'보다 '우리나라'를 많이 써요. 학교 과목 이름도 '한국어'가 아니라 '국어'예요.","video_url":"","video_title":"","phrases":[{"ko":"한국 사람 다 됐네요","example":"김치를 이렇게 잘 먹어요? 한국 사람 다 됐네요!","en":"You've practically become Korean!","nuance_ko":"한국 생활에 익숙한 외국인을 칭찬할 때","source":"AI","nuance_en":"praises a foreigner who has gotten used to life in Korea","en_equiv":"You've practically become Korean!"}],"pron_source":"wiktionary","pron_why":null,"dict_examples":[],"explain_en":"When Koreans talk about their own country, they often say '우리나라' (our country) rather than '한국'. Even the school subject is called '국어' (the national language), not '한국어'.","contract_en":""},{"id":"n00374","kind":"word","ko":"말레이시아","yo":"","en":"Malaysia","pos":"명사","usage":"","contract":"","examples":[{"id":"e01305","ko":"말레이시아는 일 년 내내 더워요.","en":"Malaysia is hot all year round.","speech_level":"해요","cloze":"말레이시아","extra_word":"내내 = throughout","extra_grammar":"","tip":"","tip_en":""},{"id":"e01306","ko":"말레이시아에서 온 친구가 있어요.","en":"I have a friend from Malaysia.","speech_level":"해요","cloze":"말레이시아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11739","ko":"말레이시아는 비가 자주 와요.","en":"It rains often in Malaysia.","speech_level":"해요","cloze":"말레이시아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11740","ko":"우리 동네에 말레이시아 음식점이 있어요.","en":"There is a Malaysian restaurant in our neighborhood.","speech_level":"해요","cloze":"말레이시아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11741","ko":"방학에 말레이시아에서 친구를 만났어요.","en":"I met a friend in Malaysia during vacation.","speech_level":"해요","cloze":"말레이시아","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"말레이시아","roman":"malleisia","explain":"“말레이시아”와 “인도네시아”는 이름이 비슷해서 헷갈려요. “말레이”로 시작하면 말레이시아, “인도네”로 시작하면 인도네시아예요.","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","pron_why":null,"dict_examples":[],"explain_en":"말레이시아 and 인도네시아 look alike and are easy to mix up. If it starts with 말레이 it is Malaysia; if it starts with 인도네 it is Indonesia.","contract_en":""},{"id":"n00375","kind":"word","ko":"태국","yo":"","en":"Thailand","pos":"명사","usage":"","contract":"","examples":[{"id":"e01307","ko":"태국 음식은 맵고 달아요.","en":"Thai food is spicy and sweet.","speech_level":"해요","cloze":"태국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01308","ko":"이번 휴가에 태국 바다에 갈 거예요.","en":"I'm going to the beach in Thailand this vacation.","speech_level":"해요","cloze":"태국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08429","ko":"태국에는 코끼리가 많아요.","en":"There are many elephants in Thailand.","speech_level":"해요","cloze":"태국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08430","ko":"태국은 항상 더워요.","en":"Thailand is always hot.","speech_level":"해요","cloze":"태국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08431","ko":"내일 태국에서 친구가 와요.","en":"A friend is coming from Thailand tomorrow.","speech_level":"해요","cloze":"태국","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"태국","roman":"taeguk","explain":"태국은 “타이”라고도 해요. 예를 들면 “타이 마사지”예요. 둘 다 같은 나라를 말해요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[],"explain_en":"Thailand can also be 타이, as in 타이 마사지. Both words point to the same country.","contract_en":""},{"id":"n00376","kind":"word","ko":"중국","yo":"","en":"China","pos":"명사","usage":"","contract":"","examples":[{"id":"e00041","ko":"제 친구는 중국 사람이에요.","en":"My friend is Chinese.","speech_level":"해요","cloze":"중국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00042","ko":"저는 중국 음식을 정말 좋아해요.","en":"I really love Chinese food.","speech_level":"해요","cloze":"중국","extra_word":"음식 = food","extra_grammar":"","tip":"","tip_en":""},{"id":"e08402","ko":"중국에 친구가 있어요? — 네, 베이징에 있어요.","en":"Do you have friends in China? — Yes, in Beijing.","speech_level":"해요","cloze":"중국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08403","ko":"주말에 중국 차를 마셔요.","en":"I drink Chinese tea on weekends.","speech_level":"해요","cloze":"중국","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08404","ko":"중국 영화를 자주 봐요.","en":"I often watch Chinese movies.","speech_level":"해요","cloze":"중국","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"중국","roman":"jungguk","explain":"한국에서 “중국집”은 중국 음식 가게예요. 짜장면과 짬뽕을 많이 팔아요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[],"explain_en":"In Korea, a 중국집 is a Chinese restaurant. It is the place for 짜장면 and 짬뽕.","contract_en":""},{"id":"n00377","kind":"word","ko":"캐나다","yo":"","en":"Canada","pos":"명사","usage":"","contract":"","examples":[{"id":"e00795","ko":"캐나다는 겨울이 아주 추워요.","en":"Winters in Canada are very cold.","speech_level":"해요","cloze":"캐나다","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00796","ko":"제 친구가 캐나다에서 왔어요.","en":"My friend is from Canada.","speech_level":"해요","cloze":"캐나다","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11724","ko":"캐나다는 한국에서 아주 멀어요.","en":"Canada is very far from Korea.","speech_level":"해요","cloze":"캐나다","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11725","ko":"캐나다는 어때요? — 아주 넓어요.","en":"What is Canada like? — It's very big.","speech_level":"해요","cloze":"캐나다","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11726","ko":"여름에 캐나다에 갈 거예요.","en":"I'm going to go to Canada in the summer.","speech_level":"해요","cloze":"캐나다","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"캐나다","roman":"kaenada","explain":"“카나다”가 아니라 “캐나다”라고 써요. 첫 글자는 “캐”예요. 발음도 [캐나다]예요.","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","pron_why":null,"dict_examples":[],"explain_en":"It is written 캐나다, not 카나다. The first letter is 캐, and you say it that way too.","contract_en":""},{"id":"n00379","kind":"word","ko":"인도네시아","yo":"","en":"Indonesia","pos":"명사","usage":"","contract":"","examples":[{"id":"e01309","ko":"인도네시아에는 섬이 아주 많아요.","en":"Indonesia has a lot of islands.","speech_level":"해요","cloze":"인도네시아","extra_word":"섬 = island","extra_grammar":"","tip":"","tip_en":""},{"id":"e01310", ":"","tip_en":""}],"pron":"도길","roman":"dongnil","explain":"독일은 쓸 때와 말할 때가 달라요. [도길]이라고 읽어요. 받침 ㄱ이 다음 소리로 가요.","video_url":"","video_title":"","phrases":[],"pron_source":"curriculum","pron_why":{"ch":[[0,"f","liaison",1]],"rules":["liaison"],"long":[]},"dict_examples":[],"explain_en":"독일 is pronounced [도길]. The final ㄱ of 독 moves onto the next syllable, so it sounds different from how it is written.","contract_en":""},{"id":"n00382","kind":"word","ko":"러시아","yo":"","en":"Russia","pos":"명사","usage":"","contract":"","examples":[{"id":"e01311","ko":"러시아의 겨울은 정말 길고 추워요.","en":"Russian winters are really long and cold.","speech_level":"해요","cloze":"러시아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01312","ko":"러시아는 세계에서 제일 큰 나라예요.","en":"Russia is the biggest country in the world.","speech_level":"해요","cloze":"러시아","extra_word":"세계 = the world","extra_grammar":"","tip":"","tip_en":""},{"id":"e11733","ko":"러시아는 나라가 아주 커요.","en":"Russia is a very big country.","speech_level":"해요","cloze":"러시아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11734","ko":"러시아 친구는 김치를 좋아해요.","en":"My Russian friend likes kimchi.","speech_level":"해요","cloze":"러시아","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11735","ko":"겨울에 러시아에 가고 싶어요.","en":"I want to go to Russia in winter.","speech_level":"해요","cloze":"러시아","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"러시아","roman":"reosia","explain":"“로시아”가 아니라 “러시아”예요. 첫 글자가 “러”예요. 러시아 말은 “러시아어”예요.","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","pron_why":null,"dict_examples":[],"explain_en":"It is 러시아, not 로시아. The first letter is 러. The language is 러시아어.","contract_en":""},{"id":"n00384","kind":"word","ko":"몽골","yo":"","en":"Mongolia","pos":"명사","usage":"","contract":"","examples":[{"id":"e01313","ko":"몽골 사람들은 말을 잘 타요.","en":"Mongolians are good at riding horses.","speech_level":"해요","cloze":"몽골","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e01314","ko":"몽골에는 사람보다 말이 더 많아요.","en":"Mongolia has more horses than people.","speech_level":"해요","cloze":"몽골","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11736","ko":"몽골 친구가 서울 회사에서 일해요.","en":"My Mongolian friend works at a company in Seoul.","speech_level":"해요","cloze":"몽골","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11737","ko":"몽골은 하늘이 정말 예뻐요.","en":"The sky in Mongolia is really beautiful.","speech_level":"해요","cloze":"몽골","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11738","ko":"다음 달에 몽골에서 친구가 와요.","en":"A friend is coming from Mongolia next month.","speech_level":"해요","cloze":"몽골","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"몽골","roman":"monggol","explain":"예전에는 “몽고”라고도 썼어요. 지금은 “몽골”이라고 써요. 오래된 책이나 말에서 “몽고”가 나오기도 해요.","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","pron_why":null,"dict_examples":[],"explain_en":"It used to be written 몽고 in Korean too. Today you write 몽골. You may still see 몽고 in older books or hear it in older speech.","contract_en":""},{"id":"n00385","kind":"word","ko":"베트남","yo":"","en":"Vietnam","pos":"명사","usage":"","contract":"","examples":[{"id":"e01315","ko":"베트남에서는 아침에 국수를 많이 먹어요.","en":"In Vietnam, people often eat noodles for breakfast.","speech_level":"해요","cloze":"베트남","extra_word":"국수 = noodles","extra_grammar":"","tip":"","tip_en":""},{"id":"e01316","ko":"베트남 커피는 아주 달아요.","en":"Vietnamese coffee is very sweet.","speech_level":"해요","cloze":"베트남","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11730","ko":"베트남 쌀국수를 먹고 싶어요.","en":"I want to eat Vietnamese rice noodles.","speech_level":"해요","cloze":"베트남","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11731","ko":"베트남에서 친구가 한국에 왔어요.","en":"A friend came to Korea from Vietnam.","speech_level":"해요","cloze":"베트남","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11732","ko":"내일 베트남 친구를 만날 거예요.","en":"I'm going to meet my Vietnamese friend tomorrow.","speech_level":"해요","cloze":"베트남","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"베트남","roman":"beteunam","explain":"한국어로는 “비엣남”이 아니라 “베트남”이에요. 처음 소리가 “베”예요. 쌀국수 가게도 “베트남 쌀국수”라고 많이 써요.","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","pron_why":null,"dict_examples":[],"explain_en":"In Korean it is 베트남, not 비엣남. It starts with the sound 베. Noodle shops often put 베트남 in the name too: 베트남 쌀국수.","contract_en":""},{"id":"n00386","kind":"word","ko":"프랑스","yo":"","en":"France","pos":"명사","usage":"","contract":"","examples":[{"id":"e00801","ko":"파리는 프랑스에 있어요.","en":"Paris is in France.","speech_level":"해요","cloze":"프랑스","extra_word":"파리 = Paris","extra_grammar":"","tip":"","tip_en":""},{"id":"e00802","ko":"저는 프랑스 영화를 좋아해요.","en":"I like French films.","speech_level":"해요","cloze":"프랑스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11727","ko":"프랑스 친구하고 파리에서 만나요.","en":"I'm meeting my French friend in Paris.","speech_level":"해요","cloze":"프랑스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11728","ko":"프랑스는 빵이 유명해요.","en":"France is famous for its bread.","speech_level":"해요","cloze":"프랑스","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e11729","ko":"올해 프랑스에 갈 거예요.","en":"I'm going to France this year.","speech_level":"해요","cloze":"프랑스","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"프랑스","roman":"peurangseu","explain":"나라 이름 뒤에 “어”를 붙이면 그 나라 말이 돼요. 프랑스어, 중국어, 일본어가 그래요. 영어만 조금 달라요.","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","pron_why":null,"dict_examples":[],"explain_en":"Add 어 after a country name to get its language: 프랑스어, 중국어, 일본어. English is the odd one out: 영어, not 영국어.","contract_en":""},{"id":"n00461","kind":"word","ko":"커피","yo":"","en":"Coffee","pos":"명사","usage":"","contract":"","examples":[{"id":"e00237","ko":"커피가 너무 써요.","en":"The coffee is too bitter.","speech_level":"해요","cloze":"커피","extra_word":"쓰다 = to be bitter","extra_grammar":"","tip":"","tip_en":""},{"id":"e00238","ko":"저는 매일 커피를 마셔요.","en":"I drink coffee every day.","speech_level":"해요","cloze":"커피","extra_word":"매일 = every day","extra_grammar":"","tip":"","tip_en":""},{"id":"e08792","ko":"아이스 커피 한 잔 주세요.","en":"One iced coffee, please.","speech_level":"해요","cloze":"커피","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08793","ko":"커피 마셔요? — 아니요, 물 마셔요.","en":"Do you drink coffee? — No, I drink water.","speech_level":"해요","cloze":"커피","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08794","ko":"회사 앞에 커피숍이 많아요.","en":"There are lots of coffee shops in front of my office.","speech_level":"해요","cloze":"커피","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"커피","roman":"keopi","explain":"한국은 카페가 정말 많은 나라예요. 점심을 먹고 동료들과 카페에 가는 게 거의 하루 일과예요.","video_url":"","video_title":"","phrases":[{"ko":"커피 한잔해요","example":"시간 되면 커피 한잔해요.","en":"Let's grab a coffee (= let's talk)","nuance_ko":"커피보다 '만나서 이야기하자'는 뜻일 때가 많음","source":"AI","nuance_en":"often means 'let's meet and talk' more than actually having coffee","en_equiv":"Let's grab a coffee (= let's talk)"}],"pron_source":"wiktionary","pron_why":null,"dict_examples":[{"ko":"커피를 끓이다.","en":"to brew coffee","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"커피를 타다.","en":"to make coffee (by mixing)","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"커피를 한 잔 마시다.","en":"to drink a cup of coffee","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"언제 마셔도 혀끝에 쓴맛을 남기는 게 커피다.","en":"Coffee is something that leaves a bitter taste on your tongue whenever you drink it.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"커피가 다 떨어져서 대신 홍차를 마셨다.","en":"The coffee ran out, so I drank black tea instead.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Korea has an amazing number of cafés. Going to a café with coworkers after lunch is almost part of the daily routine.","contract_en":""},{"id":"n00469","kind":"word","ko":"메뉴","yo":"","en":"Menu","pos":"명사","usage":"","contract":"","examples":[{"id":"e00239","ko":"여기 메뉴 좀 주세요.","en":"Could we have the menu, please?","speech_level":"해요","cloze":"메뉴","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00240","ko":"메뉴가 다 한국어예요.","en":"The menu is all in Korean.","speech_level":"해요","cloze":"메뉴","extra_word":"한국어 = Korean (language)","extra_grammar":"","tip":"","tip_en":""},{"id":"e09713","ko":"오늘 점심 메뉴는 김치찌개예요.","en":"Today's lunch menu is kimchi stew.","speech_level":"해요","cloze":"메뉴","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09714","ko":"이 카페는 메뉴가 많아요.","en":"This cafe has a lot on the menu.","speech_level":"해요","cloze":"메뉴","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e09715","ko":"메뉴를 봐요. 저는 비빔밥이에요.","en":"I look at the menu. I'll have bibimbap.","speech_level":"해요","cloze":"메뉴","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"메뉴","roman":"menyu","explain":"메뉴는 음식 이름이에요. 종이나 책은 “메뉴판”이라고 해요. 그래서 “메뉴판 주세요”라고 말하는 사람이 많아요.","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","pron_why":null,"dict_examples":[{"ko":"여기 메뉴 좀 가져다주세요.","en":"Please bring a menu here.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"메뉴를 천천히 보시고 주문하세요.","en":"Please look at the menu slowly and then order.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"메뉴에는 없지만 해 드릴게요.","en":"It's not on the menu, but I'll make it for you.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"메뉴 means the dishes on offer. The paper or book you read is called 메뉴판. That is why many people say 메뉴판 주세요 when they ask for the menu.","contract_en":""},{"id":"n00470","kind":"word","ko":"케이크","yo":"","en":"Cake","pos":"명사","usage":"","contract":"","examples":[{"id":"e00241","ko":"오늘 제 생일이에요. 케이크 먹어요!","en":"It's my birthday today. Let's have cake!","speech_level":"해요","cloze":"케이크","extra_word":"생일 = birthday","extra_grammar":"","tip"  마트에 가요.","en":"There's no water in the fridge. I'm going to the mart.","speech_level":"해요","cloze":"물","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"물","roman":"mul","explain":"한국 식당에서 물은 공짜예요. '물은 셀프'라고 쓰여 있으면 직접 가져다 마셔요.","video_url":"","video_title":"","phrases":[{"ko":"물 건너가다","example":"표가 다 팔렸어요. 여행은 물 건너갔어요.","en":"to be too late; to be a lost cause","nuance_ko":"일이 이미 틀렸을 때, 아쉬울 때","source":"AI","nuance_en":"said when a matter is already ruined and it's a pity","en_equiv":"to be too late; to be a lost cause"},{"ko":"물 쓰듯 (하다)","example":"동생은 돈을 물 쓰듯 써요.","en":"to spend like water","nuance_ko":"돈을 아끼지 않고 막 쓸 때","source":"AI","nuance_en":"said when someone spends money freely without holding back","en_equiv":"to spend like water"},{"ko":"물로 보다","example":"저를 물로 봐요? 저도 다 알아요.","en":"to take someone for a pushover","nuance_ko":"나를 우습게 볼 때 화내며","source":"AI","nuance_en":"said angrily when someone looks down on you","en_equiv":"to take someone for a pushover"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"물로 입안을 헹구다.","en":"to rinse one's mouth with water","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"물을 긷다.","en":"to draw water","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"물을 마시다.","en":"to drink water","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"물을 붓다.","en":"to pour water","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"물을 뿌리다.","en":"to sprinkle water","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Water is free at Korean restaurants. If you see a sign saying '물은 셀프' (water is self-service), go and get it yourself.","contract_en":""},{"id":"n00487","kind":"word","ko":"주스","yo":"","en":"Juice","pos":"명사","usage":"","contract":"","examples":[{"id":"e00249","ko":"저는 사과 주스를 좋아해요.","en":"I like apple juice.","speech_level":"해요","cloze":"주스","extra_word":"사과 = apple","extra_grammar":"","tip":"","tip_en":""},{"id":"e00250","ko":"아침에 주스를 마셔요.","en":"I drink juice in the eech_level":"해요","cloze":"우유","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08878","ko":"카페라테는 커피하고 우유예요.","en":"A cafe latte is coffee and milk.","speech_level":"해요","cloze":"우유","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"우유","roman":"uyu","explain":"우유는 “마시다”와 같이 써요: 우유를 마셔요. 맛 이름을 앞에 붙이면 딸기 우유, 바나나 우유, 초코 우유가 돼요. 편의점에서 쉽게 살 수 있어요.","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"우유 한 잔.","en":"a glass of milk","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"우유를 마시다.","en":"to drink milk","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"그는 우유와 빵으로 아침 식사를 했다.","en":"He had milk and bread for breakfast.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"우유 배달부.","en":"a milk delivery person","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"Milk goes with 마시다 (drink): 우유를 마셔요. Add a flavor in front: 딸기 우유 (strawberry), 바나나 우유, 초코 우유. Easy to find in any convenience store.","contract_en":""},{"id":"n00503","kind":"word","ko":"화장실","yo":"","en":"Restroom / Bathroom","pos":"명사","usage":"","contract":"","examples":[{"id":"e00161","ko":"저기, 화장실이 어디예요?","en":"Excuse me, where's the restroom?","speech_level":"해요","cloze":"화장실","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00162","ko":"화장실에 사람이 있어요.","en":"Someone's in the restroom.","speech_level":"해요","cloze":"화장실","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08948","ko":"회의 전에 화장실에 가요.","en":"I go to the restroom before the meeting.","speech_level":"해요","cloze":"화장실","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08949","ko":"화장실은 오른쪽이에요.","en":"The restroom is on the right.","speech_level":"해요","cloze":"화장실","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08950","ko":"식당 화장실이 아주 깨끗해요.","en":"The restaurant's restroom is very clean.","speech_level":"해요","cloze":"화장실","extra_word":"","extra_grammar":"","tip":""," y means going out to drink alcohol","en_equiv":"to have a drink (usually alcohol)"}],"pron_source":"우리말샘","pron_why":null,"dict_examples":[{"ko":"커피 두 잔.","en":"Two cups of coffee.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"술 석 잔.","en":"Three glasses of liquor.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"너 술 한 잔 먹고 손님께도 한 잔 따라 드려라.","en":"Have a glass of liquor yourself and pour a glass for the guest too.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"},{"ko":"나도 개성댁의 푸념을 못 들은 체 커피를 한 잔 끓여서 마셨다.","en":"I pretended not to hear Mrs. Gaeseong's grumbling and brewed and drank a cup of coffee.","src":"국립국어원 우리말샘 (CC BY-SA 2.0 KR) · 영어: AI 번역"}],"explain_en":"In Korea, when the person next to you has an empty glass, you fill it for them. When pouring for or receiving a drink from someone older, use both hands.","contract_en":""},{"id":"n00540","kind":"word","ko":"카드","yo":"","en":"Card","pos":"명사","usage":"","contract":"","examples":[{"id":"e00305","ko":"여기 카드 돼요?","en":"Do you take cards here?","speech_level":"해요","cloze":"카드","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e00306","ko":"현금은 없어요. 카드만 있어요.","en":"I don't have cash. I only have a card.","speech_level":"해요","cloze":"카드","extra_word":"현금 = cash","extra_grammar":"","tip":"","tip_en":""},{"id":"e08623","ko":"교통 카드를 충전해요.","en":"I'm topping up my transit card.","speech_level":"해요","cloze":"카드","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08624","ko":"카드로 해요, 현금으로 해요?","en":"Will you pay by card or by cash?","speech_level":"해요","cloze":"카드","extra_word":"","extra_grammar":"","tip":"","tip_en":""},{"id":"e08625","ko":"생일 카드를 써요.","en":"I'm writing a birthday card.","speech_level":"해요","cloze":"카드","extra_word":"","extra_grammar":"","tip":"","tip_en":""}],"pron":"카드","roman":"kadeu","explain":"가게에서는 “카드로 계산할게요”나 “카드로 해 주세요”라고 해요. 계산할 때 자주 쓰는 말이에요.","video_url":"","video_title":"","phrases":[{"ko":"카드를 긁다","example":"오늘은 제가 카드를 긁을게요.","en":"to pay
